<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Từ Vựng TOEIC A1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Sans:wght@400;500&display=swap">
<style>
/* Layout: ứng dụng một cột. Trên máy tính: thanh tab ở trên. Trên điện thoại: thanh tab cố định ở đáy. Tab Tổng quan có vòng mục tiêu ngày, thống kê, từ của ngày, tiến độ theo chủ đề, cài đặt. */
:root {
  --bg: #F1F4FA;
  --surface: #FFFFFF;
  --ink: #152038;
  --muted: #5A6680;
  --line: #DCE2EE;
  --accent: #2D59E8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2E9FD;
  --hl-bg: #FFE75E;
  --hl-fg: #3A3000;
  --good: #14895C;
  --good-soft: #DDF3E9;
  --bad: #C73B3B;
  --bad-soft: #FBE3E3;
  --warn: #B26A00;
  --warn-soft: #FFEFD2;
  --shadow: 0 1px 2px rgba(21,32,56,.06), 0 4px 14px rgba(21,32,56,.05);
  --f-display: "Baloo 2", "Be Vietnam Pro", system-ui, sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ipa: "Noto Sans", "Segoe UI", "Lucida Sans Unicode", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1324; --surface: #151D33; --ink: #E7ECF7; --muted: #9AA6C0; --line: #26304B;
    --accent: #7C9CFF; --accent-ink: #0D1324; --accent-soft: #1F2A52;
    --hl-bg: #4A4010; --hl-fg: #FFE75E;
    --good: #4FD39B; --good-soft: #12372B; --bad: #FF8A8A; --bad-soft: #43202A;
    --warn: #FFC266; --warn-soft: #3F2F10;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1324; --surface: #151D33; --ink: #E7ECF7; --muted: #9AA6C0; --line: #26304B;
  --accent: #7C9CFF; --accent-ink: #0D1324; --accent-soft: #1F2A52;
  --hl-bg: #4A4010; --hl-fg: #FFE75E;
  --good: #4FD39B; --good-soft: #12372B; --bad: #FF8A8A; --bad-soft: #43202A;
  --warn: #FFC266; --warn-soft: #3F2F10;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
/* CỰC KỲ QUAN TRỌNG: [hidden] phải thắng mọi display của CSS (lỗi màn hình đăng nhập không ẩn) */
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.55 var(--f-body);
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h2, h3 { text-wrap: balance; }

/* Header */
.head { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center; justify-content: space-between; }
.brand { display: flex; gap: 14px; align-items: center; min-width: 0; }
.logo { flex: 0 0 auto; width: 52px; height: 52px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.logo svg { width: 30px; height: 30px; }
.head h1 { font: 800 clamp(26px, 5.5vw, 38px)/1.05 var(--f-display); margin: 0; letter-spacing: -.01em; }
.head h1 mark { background: var(--hl-bg); color: var(--hl-fg); padding: 0 .2em; border-radius: 6px; }
.head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.progress { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; display: grid; gap: 8px; box-shadow: var(--shadow); }
.progress .row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.progress b { color: var(--ink); font-family: var(--f-display); font-size: 19px; font-variant-numeric: tabular-nums; }
.bar { height: 10px; background: var(--accent-soft); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .35s ease; }

/* Tabs */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: var(--surface); border: 1px solid var(--line); padding: 5px; border-radius: 14px; }
.tabs button { border: 0; background: transparent; padding: 10px 6px; border-radius: 10px; font: 700 16px var(--f-display); color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tabs button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: none; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px; }
.chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.chip.more { border-style: dashed; color: var(--accent); font-weight: 600; }
.chip small { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .7; }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; }
.toolbar input, .toolbar select, .field select, .field input, .field textarea {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 12px; min-width: 0;
}
.toolbar input { flex: 1 1 220px; }
.count { color: var(--muted); font-size: 14px; align-self: center; }

/* Word cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); min-width: 0; }
.card.known { border-color: var(--good); }
.card .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.word { font: 800 28px/1.1 var(--f-display); margin: 0; overflow-wrap: anywhere; }
.meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.ipa { font-family: var(--f-ipa); background: var(--hl-bg); color: var(--hl-fg); padding: 1px 9px; border-radius: 6px; font-size: 15px; }
.pos { font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 7px; }
.vi { font-size: 19px; font-weight: 600; margin: 0; color: var(--accent); }
.ex { margin: 0; font-size: 14.5px; color: var(--ink); display: grid; gap: 2px; padding-left: 12px; border-left: 3px solid var(--line); }
.ex em { color: var(--muted); font-style: normal; }
.btns { display: flex; gap: 6px; flex: 0 0 auto; }
.ico { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--accent-soft); color: var(--accent); border-radius: 12px; min-width: 42px; height: 42px; padding: 0 10px; font-weight: 600; font-size: 13px; }
.ico:hover { border-color: var(--accent); }
.ico.playing { background: var(--accent); color: var(--accent-ink); }
.ico svg { width: 20px; height: 20px; fill: currentColor; }
.ico.sm { min-width: 34px; height: 34px; border-radius: 10px; }
.ico.sm svg { width: 16px; height: 16px; }
.card .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 4px; }
.know { border: 1px solid var(--line); background: transparent; padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; }
.know[aria-pressed="true"] { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; display: grid; gap: 12px; justify-items: center; }

/* Home */
.home { display: grid; gap: 16px; }
.home-top { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.panel h2 { font: 700 18px/1.2 var(--f-display); margin: 0 0 12px; }
.today { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.ring { position: relative; width: 132px; height: 132px; flex: 0 0 auto; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { stroke: var(--accent-soft); }
.ring .val { stroke: var(--accent); transition: stroke-dashoffset .5s ease; }
.ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .mid b { font: 800 30px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.ring .mid span { font-size: 12px; color: var(--muted); }
.today .txt { display: grid; gap: 10px; min-width: 0; flex: 1 1 180px; }
.today .txt p { margin: 0; color: var(--muted); font-size: 15px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; }
.stat b { font: 800 28px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.stat.due b { color: var(--warn); }
.stat.ok b { color: var(--good); }
.home-mid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 150px; }
.week .col { display: grid; grid-template-rows: 1fr auto auto; gap: 4px; height: 100%; text-align: center; font-size: 12px; color: var(--muted); }
.week .col .tr { display: flex; align-items: flex-end; }
.week .col .b { width: 100%; background: var(--accent); border-radius: 6px 6px 3px 3px; min-height: 3px; }
.week .col.zero .b { background: var(--line); }
.week .col.today-col .b { background: var(--hl-bg); outline: 2px solid var(--accent); }
.week .col b { color: var(--ink); font-variant-numeric: tabular-nums; font-size: 13px; }
.wod .word { font-size: 38px; }
.wod .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 8px 0; }
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.trow { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.trow:hover { border-color: var(--accent); }
.trow .l { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 500; }
.trow .l small { color: var(--muted); font-variant-numeric: tabular-nums; }
.trow .bar { height: 7px; }
.trow .bar i { background: var(--good); }
.settings { display: grid; gap: 14px; }
.setrow { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.setrow > span { font-weight: 600; font-size: 15px; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 600; font-size: 14px; }
.field textarea { min-height: 84px; font: 12px/1.4 var(--f-ipa); resize: vertical; width: 100%; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }

/* Flashcards */
.fwrap { display: grid; gap: 14px; justify-items: center; }
.fopts { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; font-size: 14px; color: var(--muted); }
.fopts label { display: inline-flex; align-items: center; gap: 6px; }
.fcount { font: 700 15px var(--f-display); color: var(--muted); font-variant-numeric: tabular-nums; }
.scene { width: min(560px, 100%); height: 340px; perspective: 1200px; }
.fc { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,.7,.2,1); cursor: pointer; }
.fc.flip { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; text-align: center; }
.face.back { transform: rotateY(180deg); }
.face .big { font: 800 clamp(40px, 11vw, 64px)/1 var(--f-display); overflow-wrap: anywhere; }
.face .ipa { font-size: 20px; padding: 2px 12px; }
.face .vi { font-size: clamp(26px, 6vw, 34px); font-family: var(--f-display); font-weight: 700; }
.face .hint { font-size: 13px; color: var(--muted); }
.face .ex { text-align: left; max-width: 420px; }
.fbtns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 11px 20px; border-radius: 12px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.good { background: var(--good-soft); color: var(--good); border-color: var(--good); }
.btn.bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.btn.danger { background: var(--bad); color: var(--bg); border-color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.donebox { text-align: center; display: grid; gap: 12px; justify-items: center; max-width: 460px; }
.donebox .score { font-size: 48px; }

/* Quiz */
.quiz { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: clamp(16px, 4vw, 28px); box-shadow: var(--shadow); display: grid; gap: 18px; max-width: 640px; width: 100%; margin: 0 auto; }
.quiz h2 { font: 800 26px/1.1 var(--f-display); margin: 0; }
.quiz .opts { display: grid; gap: 10px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--bg); padding: 13px 16px; border-radius: 14px; font-size: 17px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.opt .ipa { font-size: 13px; }
.qtop { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
.qprompt { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.qprompt .word { font-size: 38px; }
.typebox { display: flex; gap: 10px; flex-wrap: wrap; }
.typebox input { flex: 1 1 200px; font: 600 20px var(--f-body); padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); min-width: 0; }
.typebox input:disabled { opacity: .8; }
.feedback { font-weight: 600; min-height: 1.5em; }
.score { font: 800 56px/1 var(--f-display); color: var(--accent); }
.review { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.review li { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 10px 12px; border-radius: 10px; background: var(--bad-soft); }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); z-index: 30; }
.note { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }
/* Màn hình đăng nhập / đăng ký */
.auth { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; padding: 16px; overflow: auto; }
.authbox { width: min(430px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 24px; box-shadow: var(--shadow); display: grid; gap: 14px; text-align: left; }
.authbox h2 { font: 800 26px/1.1 var(--f-display); margin: 0; }
.authswitch { display: flex; gap: 8px; }
.authswitch button { flex: 1; border: 1px solid var(--line); background: var(--bg); padding: 9px; border-radius: 10px; font-weight: 700; font-family: var(--f-display); }
.authswitch button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.aerr { color: var(--bad); font-size: 14px; font-weight: 500; margin: 0; min-height: 1.2em; }
.hair { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.hair::before, .hair::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.gbtn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }
.gbtn svg { width: 18px; height: 18px; flex: 0 0 auto; }
/* Chip người dùng ở đầu trang */
.userbox { display: flex; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 4px 4px 14px; box-shadow: var(--shadow); max-width: 260px; }
.userbox i.dot { width: 9px; height: 9px; border-radius: 99px; background: var(--good); flex: 0 0 auto; }
.userbox b { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.userbox button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; flex: 0 0 auto; }
.userbox button:hover { border-color: var(--bad); color: var(--bad); }
@media (prefers-reduced-motion: reduce) { .fc, .bar i, .ring .val { transition: none; } }
@media (max-width: 820px) { .home-top, .home-mid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 720px) {
  body { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; border-radius: 18px 18px 0 0; border-width: 1px 0 0; gap: 2px;
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); box-shadow: 0 -6px 18px rgba(0,0,0,.08); }
  .tabs button { font-size: 12.5px; padding: 6px 2px; }
  .tabs button svg { display: block; }
  .toast { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 480px) { .scene { height: 360px; } .word { font-size: 25px; } .ring { width: 112px; height: 112px; } }
</style>
</head>
<body>


<div class="wrap">
  <header class="head">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 8h6M9 12h4"/></svg></div>
      <div>
        <h1>Vocabulary</h1>
        <p id="tagline"></p>
      </div>
    </div>
    <div class="seg" role="group" aria-label="Chọn giọng đọc">
      <button type="button" data-act="accent" data-v="en-US" aria-pressed="true">Giọng Mỹ</button>
      <button type="button" data-act="accent" data-v="en-GB" aria-pressed="false">Giọng Anh</button>
    </div>
    <div class="userbox" id="userbox" hidden>
      <i class="dot" aria-hidden="true"></i>
      <b id="uName"></b>
      <button type="button" id="uSignout">Đăng xuất</button>
    </div>
  </header>

  <section class="progress" aria-label="Tiến độ" id="gprog">
    <div class="row"><span>Đã thuộc <b id="pKnown">0</b> / <b id="pTotal">0</b> từ</span><span id="pPct"></span></div>
    <div class="bar"><i id="pBar" style="width:0%"></i></div>
  </section>

  <nav class="tabs" role="tablist" aria-label="Chế độ học">
    <button type="button" role="tab" data-act="tab" data-v="home" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Tổng quan</button>
    <button type="button" role="tab" data-act="tab" data-v="list" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Danh sách</button>

<script>
/* ===== Firebase: xác thực + đồng bộ tiến độ theo tài khoản (Firestore) ===== */
var firebaseConfig = {
  apiKey: "AIzaSyByoRvy3OfFrJmccB-uebwXdiwjbYkTP60",
  authDomain: "vocabulary-toeic-8150e.firebaseapp.com",
  projectId: "vocabulary-toeic-8150e",
  storageBucket: "vocabulary-toeic-8150e.firebasestorage.app",
  messagingSenderId: "829805879202",
  appId: "1:829805879202:web:fa8e082b2474391c6d9cfb"
};
firebase.initializeApp(firebaseConfig);
var AUTH = firebase.auth();
var DB = firebase.firestore();

var CLOUD = { user: null, timer: null };
var $ = function (s) { return document.querySelector(s); };

/* Ghi dữ liệu tiến độ hiện tại của máy lên Firestore (users/{uid}).
    Được gọi từ hàm save() — bấm liên tục cũng chỉ ghi 1 lần sau ~1.2 giây. */
function cloudNow() {
  if (!CLOUD.user) return;
  clearTimeout(CLOUD.timer);
  CLOUD.timer = setTimeout(cloudPush, 1200);
}
function cloudPush() {
  if (!CLOUD.user) return;
  DB.collection('users').doc(CLOUD.user.uid).set({
    known: known, srs: srs, stats: stats, pref: pref,
    name: CLOUD.user.displayName || '', email: CLOUD.user.email || '',
    updatedAt: Date.now()
  }, { merge: true })
  .catch(function (e) { console.warn('Lưu đám mây lỗi:', e); toast('Không đồng bộ được lên tài khoản — kiểm tra mạng rồi thử lại.'); });
}

/* Nạp tiến độ từ Firestore về máy khi đăng nhập.
   - Tài khoản đã có dữ liệu trên đám mây: lấy bản đám mây làm chuẩn.
   - Tài khoản mới chưa có gì: giữ dữ liệu đang nằm trong trình duyệt (nếu máy đó học từ trước) và đẩy lên tài khoản. */
function cloudLoad(u) {
  DB.collection('users').doc(u.uid).get().then(function (doc) {
    var d = doc.exists ? doc.data() : null;
    if (d && typeof d.known === 'object' && d.known) {
      known = d.known || {}; srs = d.srs || {}; stats = d.stats || {};
      var p = d.pref || {};
      p.accent = p.accent || 'en-US'; p.rate = p.rate || 0.9; p.goal = p.goal || 10;
      pref = p;
      save(KEYS.known, known); save(KEYS.srs, srs); save(KEYS.stats, stats); save(KEYS.pref, pref);
    } else {
      cloudPush(); // tạo bản ghi đầu tiên cho tài khoản (kèm tiến độ cũ trên máy nếu có)
    }
    if (typeof render === 'function') render();
  }).catch(function (e) {
    console.warn('Nạp tiến độ lỗi:', e);
    toast('Không tải được tiến độ từ tài khoản — đang dùng dữ liệu trên máy này.');
    if (typeof render === 'function') render();
  });
}

/* Thông báo lỗi xác thực bằng tiếng Việt */
function authErr(e) {
  var c = e && e.code || '';
  if (c === 'auth/invalid-email' || c === 'auth/invalid-credential' || c === 'auth/invalid-email-address') return 'Email hoặc mật khẩu không đúng.';
  if (c === 'auth/user-not-found' || c.indexOf('wrong-password') > -1 || c.indexOf('invalid-credential') > -1) return 'Email hoặc mật khẩu không đúng.';
  if (c.indexOf('email-already-in-use') > -1) return 'Email này đã được đăng ký. Hãy bấm "Đã có tài khoản" để đăng nhập.';
  if (c.indexOf('operation-not-allowed') > -1 || c.indexOf('admin-restricted') > -1) return 'Phương thức đăng nhập này chưa được bật. Vào Firebase Console → Authentication → Sign-in method và bật Email/Password (và Google).';
  if (c === 'auth/weak-password') return 'Mật khẩu quá yếu — cần tối thiểu 6 ký tự.';
  if (c === 'auth/too-many-requests') return 'Bạn thử quá nhiều lần. Hãy chờ một lát rồi thử lại.';
  if (c === 'auth/network-request-failed') return 'Lỗi mạng. Kiểm tra kết nối Internet của bạn.';
  if (c === 'auth/popup-blocked') return 'Trình duyệt chặn cửa sổ Google. Cho phép cửa sổ bật lên (popup) rồi thử lại.';
  if (c === 'auth/popup-closed-by-user') return 'Bạn đã đóng cửa sổ Google trước khi hoàn tất.';
  if (c.indexOf('unauthorized-domain') > -1) return 'Trang này chưa được phép đăng nhập Google. Hãy thêm tên miền vào Firebase → Authentication → Settings → Authorized domains.';
  return 'Không thực hiện được: ' + (c || (e && e.message) || 'lỗi không rõ');
}

/* Vượt màn hình đăng nhập theo trạng thái tài khoản */
function updateAuthUI(u) {
  var ov = $('#auth'); if (!ov) return;
  ov.hidden = !!u;
  var ub = $('#userbox');
  ub.hidden = !u;
  if (u) $('#uName').textContent = u.displayName || (u.email || 'Bạn').split('@')[0];
  if (!u) { try { var o = localStorage.getItem('toeic-a1-authout-v1'); if (o) $('#aLastOut').textContent = '🔎 ' + o + ' — lưu ý: trình duyệt đang chặn lưu phiên (kiểm tra chế độ ẩn danh / chặn cookie).'; } catch (e) {} }
}

var AMODE = 'login';
function setMode(m) {
  AMODE = m;
  $('#swLogin').setAttribute('aria-pressed', m === 'login');
  $('#swReg').setAttribute('aria-pressed', m === 'register');
  $('#nameField').hidden = m === 'login';
  $('#aTitle').textContent = m === 'login' ? 'Đăng nhập' : 'Đăng ký tài khoản';
  $('#aGo').textContent = m === 'login' ? 'Đăng nhập' : 'Tạo tài khoản';
  $('#aGo').className = 'btn primary';
  $('#aHint').textContent = m === 'login' ? 'Đăng nhập để tiến độ học được lưu theo tài khoản của bạn.' : 'Tài khoản mới bắt đầu với tiến độ trống — mỗi tài khoản có dữ liệu riêng.';
  $('#aErr').textContent = '';
}
$('#swLogin').onclick = function () { setMode('login'); };
$('#swReg').onclick = function () { setMode('register'); };

$('#aGo').onclick = function () {
  var err = $('#aErr'); err.textContent = '';
  var email = $('#aEmail').value.trim();
  var pass = $('#aPass').value;
  var name = $('#aName').value.trim();
  if (!email) { err.textContent = 'Bạn chưa nhập email.'; return; }
  if (pass.length < 6) { err.textContent = 'Mật khẩu cần tối thiểu 6 ký tự.'; return; }
  if (AMODE === 'register' && !name) { err.textContent = 'Bạn chưa nhập tên hiển thị.'; return; }
  var btn = $('#aGo'); btn.disabled = true;
  function done(errMsg) { btn.disabled = false; if (errMsg) err.textContent = errMsg; }
  if (AMODE === 'login') {
    AUTH.signInWithEmailAndPassword(email, pass).catch(function (e) { done(authErr(e)); });
  } else {
    AUTH.createUserWithEmailAndPassword(email, pass).then(function (cu) {
      return cu.user.updateProfile({ displayName: name }).then(function () {
        $('#uName').textContent = name; toast('Chào mừng ' + name + '!');
      });
    }).catch(function (e) { done(authErr(e)); });
  }
};

$('#aGoogle').onclick = function () {
  $('#aErr').textContent = '';
  var onGithub = location.hostname.indexOf('github.io') > -1;
  if (onGithub) {
    // GitHub Pages đặt COOP làm popup không hoạt động — dùng redirect (quay lại trang sau khi chọn tài khoản)
    AUTH.signInWithRedirect(new firebase.auth.GoogleAuthProvider())
      .catch(function (e) { $('#aErr').textContent = authErr(e); });
  } else {
    AUTH.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function (e) {
      if (e && e.code === 'auth/popup-blocked') {
        AUTH.signInWithRedirect(new firebase.auth.GoogleAuthProvider()).catch(function (e2) { $('#aErr').textContent = authErr(e2); });
      } else $('#aErr').textContent = authErr(e);
    });
  }
};

/* Bắt kết quả redirect từ Google: trả về trang xong nếu Google trả lỗi thì hiện ra */
AUTH.getRedirectResult().catch(function (e) {
  $('#aErr').textContent = authErr(e);
});

/* Nút thaoo của cầu cản: nếu về từ Google mà vẫn màn đăng nhập, bấm để nhận lại phiên (có thể do trình duyệt cache) */
$('#aRetry').onclick = function () {
  $('#aErr').textContent = 'Đang nhận lại phiên...';
  AUTH.getRedirectResult().then(function () {
    setTimeout(function () {
      var u = AUTH.currentUser;
      $('#aErr').textContent = '';
      updateAuthUI(u);
      if (u) {
        $('#uName').textContent = u.displayName || (u.email || 'Bạn').split('@')[0];
        cloudLoad(u);
        toast('Đã vào lại app!');
      } else {
        $('#aErr').textContent = 'Vẫn chưa nhận được phiên. Hãy bấm Ctrl+F5 tải lại trang (bỏ cache), hoặc thử đăng nhập bằng Email/mật khẩu.';
      }
    }, 800);
  }).catch(function (e) { $('#aErr').textContent = authErr(e); });
};

$('#uSignout').onclick = function () {
  AUTH.signOut().then(function () {
    CLOUD.user = null; setMode('login'); $('#aPass').value = '';
    toast('Đã đăng xuất.');
  });
};

/* Nhập email sau khi Enter ở ô mật khẩu */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || ($('#auth') && $('#auth').hidden)) return;
  var t = e.target;
  if (t && (t.id === 'aEmail' || t.id === 'aPass' || t.id === 'aName')) { e.preventDefault(); $('#aGo').click(); }
});

/* Chẩn đoán mất phiên: khi đang đăng nhập mà tự bị đẩy ra, ghi lại thời điểm để báo trên màn hình đăng nhập */
var OUT_KEY = 'toeic-a1-authout-v1';
AUTH.onAuthStateChanged(function (u) {
  if (!u && window.__prevUser) {
    try {
      var d = new Date();
      localStorage.setItem(OUT_KEY, 'Phiên mất lúc ' + d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2) + ' ' + d.getDate() + '/' + (d.getMonth() + 1));
    } catch (e) {}
  }
  window.__prevUser = u ? u.uid : null;
});

/* Lắng nghe trạng thái đăng nhập: đổi dữ liệu theo tài khoản, hiện/ẩn màn hình */
AUTH.onAuthStateChanged(function (u) {
  CLOUD.user = u || null;
  updateAuthUI(u);
  if (u) {
    $('#uName').textContent = u.displayName || ((u.email || '').split('@')[0] || 'Bạn');
    cloudLoad(u);
  }
});

/* Nhận thông báo khi dữ liệu thay đổi (hook từ phần ứng dụng chính) */
window.__onAppDataChanged = cloudNow;
</script>

    '<div class="scene"><div class="fc' + (S.flip ? ' flip' : '') + '" id="fc" data-act="flip" role="button" tabindex="0" aria-label="Lật thẻ">' +
    '<div class="face front"><div class="big">' + esc(w.w) + '</div><span class="ipa">/' + esc(w.ipa) + '/</span>' +
    '<button type="button" class="ico" data-act="say" data-i="' + w.i + '" aria-label="Nghe">' + SPK + ' Nghe</button><span class="hint">Chạm vào thẻ để xem nghĩa</span></div>' +
    '<div class="face back"><div class="vi">' + esc(w.vi) + '</div><span class="pos">' + esc(w.pos) + '</span>' +
    (w.ex ? '<p class="ex"><span>' + esc(w.ex) + '</span><em>' + esc(w.exvi) + '</em></p><button type="button" class="ico sm" data-act="sayex" data-i="' + w.i + '" aria-label="Nghe câu ví dụ">' + SPK + '</button>' : '') + '</div></div></div>' +
    '<div class="fbtns"><button type="button" class="btn" data-act="prev" ' + (S.di === 0 ? 'disabled' : '') + '>Trước</button>' +
    '<button type="button" class="btn bad" data-act="fnew" data-i="' + w.i + '">Chưa nhớ</button>' +
    '<button type="button" class="btn good" data-act="fknow" data-i="' + w.i + '">Nhớ rồi</button>' +
    '<button type="button" class="btn primary" data-act="next" ' + (S.di === d.length - 1 ? 'disabled' : '') + '>Sau</button></div>' +
    '<div class="note">Phím tắt: Space lật thẻ, mũi tên chuyển thẻ, phím 1 là chưa nhớ, phím 2 là nhớ rồi.</div></div>';
  $('#view').innerHTML = h;
  if (say && S.auto) speak(w.w, 0.95);
}
function goCard(n) { if (n < 0 || n >= S.deck.length) return; S.di = n; S.flip = false; renderFlash(true); }
function rateCard(w, good) {
  grade(w, good); if (good) S.done.good++; else S.done.bad++;
  refreshChrome(); S.di++; S.flip = false; renderFlash(true);
}

/* ===== Kiểm tra ===== */
function renderQuizSetup() {
  $('#view').innerHTML = '<div class="quiz"><h2>Kiểm tra nhanh</h2><p style="margin:0;color:var(--muted)">Chủ đề: <b style="color:var(--ink)">' + esc(topicName()) + '</b>. Đổi chủ đề ở thanh phía trên. Từ trả lời sai sẽ được đưa vào danh sách ôn hôm nay.</p>' +
    '<div class="field"><label for="qm">Kiểu câu hỏi</label><select id="qm"><option value="vi">Xem từ tiếng Anh, chọn nghĩa tiếng Việt</option><option value="listen">Nghe phát âm, chọn từ tiếng Anh</option><option value="type">Nghe và gõ lại từ (nhìn nghĩa tiếng Việt)</option></select></div>' +
    '<div class="field"><label for="ql">Số câu</label><select id="ql"><option value="10">10 câu</option><option value="20">20 câu</option><option value="30">30 câu</option></select></div>' +
    '<button type="button" class="btn primary" data-act="qstart" ' + (pool().length < 2 ? 'disabled' : '') + '>Bắt đầu</button></div>';
  $('#qm').value = S.qmode; $('#ql').value = String(S.qlen);
}
function startQuiz() { S.quiz = { items: shuffle(pool()).slice(0, S.qlen), i: 0, score: 0, wrong: [], answered: false, opts: [] }; renderQuestion(); }
function makeOpts(w) {
  var others = shuffle(ALL.filter(function (x) { return x.w !== w.w && x.vi !== w.vi && x.pos === w.pos; }));
  if (others.length < 3) others = shuffle(ALL.filter(function (x) { return x.w !== w.w && x.vi !== w.vi; }));
  return shuffle([w].concat(others.slice(0, 3)));
}
function renderQuestion() {
  var q = S.quiz;
  if (q.i >= q.items.length) { renderResult(); return; }
  var w = q.items[q.i]; q.answered = false;
  var prompt, body;
  if (S.qmode === 'type') {
    prompt = '<div class="qprompt"><button type="button" class="ico" data-act="say" data-i="' + w.i + '" aria-label="Nghe lại">' + SPK + ' Nghe lại</button><button type="button" class="ico" data-act="slow" data-i="' + w.i + '">Chậm</button></div><div>Nghĩa: <b>' + esc(w.vi) + '</b> (' + esc(w.pos) + '). Gõ từ tiếng Anh bạn nghe được.</div>';
    body = '<div class="typebox"><input id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Gõ từ ở đây" aria-label="Từ tiếng Anh"><button type="button" class="btn primary" data-act="check">Kiểm tra</button></div>';
  } else {
    q.opts = makeOpts(w);
    prompt = S.qmode === 'vi'
      ? '<div class="qprompt"><span class="word">' + esc(w.w) + '</span><span class="ipa">/' + esc(w.ipa) + '/</span><button type="button" class="ico" data-act="say" data-i="' + w.i + '" aria-label="Nghe">' + SPK + '</button></div><div>Nghĩa tiếng Việt của từ này là gì?</div>'
      : '<div class="qprompt"><button type="button" class="ico" data-act="say" data-i="' + w.i + '" aria-label="Nghe lại">' + SPK + ' Nghe lại</button><button type="button" class="ico" data-act="slow" data-i="' + w.i + '">Chậm</button></div><div>Bạn nghe thấy từ nào?</div>';
    body = '<div class="opts">' + q.opts.map(function (o, k) {
      return '<button type="button" class="opt" data-act="ans" data-k="' + k + '"><span>' + (S.qmode === 'vi' ? esc(o.vi) : esc(o.w)) + '</span>' + (S.qmode === 'vi' ? '' : '<span class="ipa">/' + esc(o.ipa) + '/</span>') + '</button>';
    }).join('') + '</div>';
  }
  $('#view').innerHTML = '<div class="quiz"><div class="qtop"><span>Câu ' + (q.i + 1) + ' / ' + q.items.length + '</span><span>Đúng: ' + q.score + '</span></div>' +
    '<div class="bar"><i style="width:' + (q.i / q.items.length * 100) + '%"></i></div>' + prompt + body +
    '<div class="feedback" id="fb" aria-live="polite"></div><div id="qnext"></div></div>';
  if (S.qmode !== 'vi') speak(w.w, 0.95);
  if (S.qmode === 'type') setTimeout(function () { var a = $('#ans'); if (a) a.focus(); }, 0);
}
function finishQ(ok) {
  var q = S.quiz, w = q.items[q.i]; q.answered = true;
  if (ok) q.score++;
  else { q.wrong.push(w); var s = srs[w.w] || {}; s.b = 1; s.d = today(); srs[w.w] = s; delete known[w.w]; save(KEYS.srs, srs); save(KEYS.known, known); }
  bump(); refreshChrome();
  var fb = $('#fb');
  fb.innerHTML = ok ? 'Chính xác!' : 'Đáp án đúng: <b>' + esc(w.w) + '</b> /' + esc(w.ipa) + '/ = ' + esc(w.vi);
  fb.style.color = ok ? 'var(--good)' : 'var(--bad)';
  $('#qnext').innerHTML = '<button type="button" class="btn primary" data-act="qnext" id="qn">' + (q.i === q.items.length - 1 ? 'Xem kết quả' : 'Câu tiếp theo') + '</button>';
  if (S.qmode === 'vi') speak(w.w, 0.95);
}
function answer(k) {
  var q = S.quiz; if (q.answered) return;
  var w = q.items[q.i], ok = q.opts[k].w === w.w;
  document.querySelectorAll('.opt').forEach(function (b, idx) {
    b.disabled = true;
    if (q.opts[idx].w === w.w) b.classList.add('right'); else if (idx === k) b.classList.add('wrong');
  });
  finishQ(ok);
}
function normWord(s) { return String(s).toLowerCase().replace(/\(.*?\)/g, ' ').replace(/[^a-z0-9' -]/g, ' ').replace(/\s+/g, ' ').trim(); }
function checkTyped() {
  var q = S.quiz; if (!q || q.answered) return;
  var inp = $('#ans'); if (!inp) return;
  var w = q.items[q.i], v = normWord(inp.value);
  if (!v) { toast('Hãy gõ từ bạn nghe được.'); return; }
  var full = String(w.w).toLowerCase().replace(/[()]/g, ' ').replace(/\s+/g, ' ').trim();
  var ok = v === normWord(w.w) || v === full;
  inp.disabled = true; inp.style.borderColor = ok ? 'var(--good)' : 'var(--bad)';
  finishQ(ok);
  var n = $('#qn'); if (n) n.focus();
}
function renderResult() {
  var q = S.quiz, n = q.items.length;
  var msg = q.score === n ? 'Tuyệt vời, bạn đúng hết.' : q.score >= n * 0.7 ? 'Khá tốt. Ôn lại vài từ sai là xong.' : 'Cần ôn thêm. Hãy xem lại các từ bên dưới.';
  var rev = q.wrong.length ? '<h3 style="margin:0">Từ cần ôn lại</h3><ul class="review">' + q.wrong.map(function (w) {
    return '<li><b>' + esc(w.w) + '</b><span class="ipa">/' + esc(w.ipa) + '/</span><span>' + esc(w.vi) + '</span><button type="button" class="ico sm" data-act="say" data-i="' + w.i + '" aria-label="Nghe">' + SPK + '</button></li>';
  }).join('') + '</ul>' : '';
  $('#view').innerHTML = '<div class="quiz"><h2>Kết quả</h2><div class="score">' + q.score + '/' + n + '</div><p style="margin:0">' + msg + '</p>' + rev +
    '<div class="fbtns" style="justify-content:flex-start"><button type="button" class="btn primary" data-act="qstart">Làm lại</button><button type="button" class="btn" data-act="qreset">Đổi kiểu câu hỏi</button></div></div>';
}

/* ===== Điều khiển chung ===== */
function setTab(t) {
  S.tab = t; S.quiz = null;
  if (t === 'flash') { if (!S.fmode) S.fmode = dueWords(pool()).length ? 'due' : 'new'; buildDeck(); }
  render();
}
function render() {
  refreshChrome();
  document.querySelectorAll('.tabs button').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.v === S.tab); });
  document.querySelectorAll('[data-act="accent"]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === pref.accent); });
  $('#chipwrap').hidden = S.tab === 'home';
  $('#gprog').hidden = S.tab === 'home';
  if (S.tab === 'home') renderHome();
  else if (S.tab === 'list') renderList();
  else if (S.tab === 'flash') renderFlash(false);
  else renderQuizSetup();
}
function makeBackup() { return JSON.stringify({ v: 1, known: known, srs: srs, stats: stats }); }
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  var a = el.dataset.act, i = el.dataset.i, w = i != null ? ALL[+i] : null;
  if (a !== 'reset' && S.confirmReset) S.confirmReset = false;
  switch (a) {
    case 'accent': pref.accent = el.dataset.v; save(KEYS.pref, pref); if (!voices.length) loadVoices(); document.querySelectorAll('[data-act="accent"]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === pref.accent); }); toast(pref.accent === 'en-US' ? 'Đã chọn giọng Mỹ' : 'Đã chọn giọng Anh'); break;
    case 'rate': pref.rate = parseFloat(el.dataset.v); save(KEYS.pref, pref); renderHome(); speak('Hello, welcome to English', 1); break;
    case 'goal': pref.goal = parseInt(el.dataset.v, 10); save(KEYS.pref, pref); renderHome(); break;
    case 'tab': setTab(el.dataset.v); break;
    case 'chips': S.chipsOpen = !S.chipsOpen; renderChips(); break;
    case 'more': S.limit += 60; refreshGrid(); break;
    case 'topic': S.topic = el.dataset.v; S.limit = 60; S.quiz = null; if (S.tab === 'flash') buildDeck(); render(); break;
    case 'gotopic': S.topic = el.dataset.v; S.limit = 60; S.status = 'all'; S.q = ''; setTab('list'); window.scrollTo(0, 0); break;
    case 'startstudy': S.topic = 'all'; S.fmode = dueWords().length ? 'due' : (newWords().length ? 'new' : 'topic'); setTab('flash'); window.scrollTo(0, 0); break;
    case 'say': speak(w.w, 1, el); break;
    case 'slow': speak(w.w, 0.6, el); break;
    case 'sayex': speak(w.ex, 0.95, el); break;
    case 'know':
      known[w.w] = !known[w.w]; if (!known[w.w]) delete known[w.w]; else bump();
      save(KEYS.known, known); refreshChrome();
      if (S.status === 'all') { var card = el.closest('.card'); card.classList.toggle('known', !!known[w.w]); el.setAttribute('aria-pressed', !!known[w.w]); el.textContent = known[w.w] ? 'Đã thuộc' : 'Đánh dấu đã thuộc'; } else refreshGrid();
      break;
    case 'flip': S.flip = !S.flip; $('#fc').classList.toggle('flip', S.flip); break;
    case 'prev': goCard(S.di - 1); break;
    case 'next': goCard(S.di + 1); break;
    case 'fknow': rateCard(w, true); break;
    case 'fnew': rateCard(w, false); break;
    case 'fmode': S.fmode = el.dataset.v; buildDeck(); renderFlash(false); break;
    case 'restartdeck': buildDeck(); renderFlash(true); break;
    case 'shuffle': S.deck = shuffle(S.deck); S.di = 0; S.flip = false; renderFlash(true); break;
    case 'qstart': if ($('#qm')) { S.qmode = $('#qm').value; S.qlen = parseInt($('#ql').value, 10); } startQuiz(); break;
    case 'qreset': S.quiz = null; renderQuizSetup(); break;
    case 'ans': answer(+el.dataset.k); break;
    case 'check': checkTyped(); break;
    case 'qnext': S.quiz.i++; renderQuestion(); break;
    case 'backup': $('#bk').value = makeBackup(); $('#bk').select(); toast('Đã tạo mã. Hãy sao chép và lưu lại.'); break;
    case 'copybk':
      if (!$('#bk').value) $('#bk').value = makeBackup();
      $('#bk').select();
      try { navigator.clipboard.writeText($('#bk').value).then(function () { toast('Đã sao chép mã sao lưu.'); }, function () { toast('Hãy nhấn Ctrl+C để sao chép mã đang chọn.'); }); } catch (err) { toast('Hãy nhấn Ctrl+C để sao chép mã đang chọn.'); }
      break;
    case 'restore':
      try {
        var d = JSON.parse($('#bk').value);
        if (!d || typeof d.known !== 'object' || typeof d.srs !== 'object' || typeof d.stats !== 'object') throw new Error('bad');
        known = d.known; srs = d.srs; stats = d.stats;
        save(KEYS.known, known); save(KEYS.srs, srs); save(KEYS.stats, stats);
        toast('Đã khôi phục tiến độ.'); render();
      } catch (err) { toast('Mã không hợp lệ. Hãy dán đúng mã đã sao lưu.'); }
      break;
    case 'reset':
      if (!S.confirmReset) { S.confirmReset = true; renderHome(); }
      else { known = {}; srs = {}; stats = {}; save(KEYS.known, known); save(KEYS.srs, srs); save(KEYS.stats, stats); S.confirmReset = false; toast('Đã xóa toàn bộ tiến độ.'); render(); }
      break;
  }
});
document.addEventListener('input', function (e) { if (e.target.id === 'q') { S.q = e.target.value; S.limit = 60; refreshGrid(); } });
document.addEventListener('change', function (e) {
  if (e.target.id === 'st') { S.status = e.target.value; S.limit = 60; refreshGrid(); }
  if (e.target.id === 'auto') S.auto = e.target.checked;
  if (e.target.id === 'qm') S.qmode = e.target.value;
  if (e.target.id === 'ql') S.qlen = parseInt(e.target.value, 10);
});
document.addEventListener('keydown', function (e) {
  var t = e.target.tagName;
  if (e.key === 'Enter' && e.target.id === 'ans') { e.preventDefault(); checkTyped(); return; }
  if (S.tab !== 'flash' || t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA' || !S.deck.length || S.di >= S.deck.length) return;
  var w = S.deck[S.di];
  if (e.key === 'ArrowRight') goCard(S.di + 1);
  else if (e.key === 'ArrowLeft') goCard(S.di - 1);
  else if (e.key === ' ') { e.preventDefault(); S.flip = !S.flip; $('#fc').classList.toggle('flip', S.flip); }
  else if (e.key === '1') rateCard(w, false);
  else if (e.key === '2') rateCard(w, true);
});
render();
</script>

</body>
</html>
