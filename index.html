<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Từ Vựng TOEIC A1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Sans:wght@400;500&display=swap">
<style>
/* Layout: một cột giữa trang, thanh tiến độ trên cùng, 3 tab (Danh sách / Flashcard / Kiểm tra), lọc chủ đề bằng chip cuộn ngang. */
:root {
  --bg: #F1F4FA;
  --surface: #FFFFFF;
  --ink: #152038;
  --muted: #5A6680;
  --line: #DCE2EE;
  --accent: #2D59E8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2E9FD;
  --hl-bg: #FFE75E;
  --hl-fg: #3A3000;
  --good: #14895C;
  --good-soft: #DDF3E9;
  --bad: #C73B3B;
  --bad-soft: #FBE3E3;
  --shadow: 0 1px 2px rgba(21,32,56,.06), 0 4px 14px rgba(21,32,56,.05);
  --f-display: "Baloo 2", "Be Vietnam Pro", system-ui, sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ipa: "Noto Sans", "Segoe UI", "Lucida Sans Unicode", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1324; --surface: #151D33; --ink: #E7ECF7; --muted: #9AA6C0; --line: #26304B;
    --accent: #7C9CFF; --accent-ink: #0D1324; --accent-soft: #1F2A52;
    --hl-bg: #4A4010; --hl-fg: #FFE75E;
    --good: #4FD39B; --good-soft: #12372B; --bad: #FF8A8A; --bad-soft: #43202A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1324; --surface: #151D33; --ink: #E7ECF7; --muted: #9AA6C0; --line: #26304B;
  --accent: #7C9CFF; --accent-ink: #0D1324; --accent-soft: #1F2A52;
  --hl-bg: #4A4010; --hl-fg: #FFE75E;
  --good: #4FD39B; --good-soft: #12372B; --bad: #FF8A8A; --bad-soft: #43202A;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.55 var(--f-body);
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

/* Header */
.head { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; }
.head h1 { font: 800 clamp(30px, 6vw, 44px)/1.05 var(--f-display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.head h1 mark { background: var(--hl-bg); color: var(--hl-fg); padding: 0 .22em; border-radius: 6px; }
.head p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 5px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.progress { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; box-shadow: var(--shadow); }
.progress .row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.progress b { color: var(--ink); font-family: var(--f-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.bar { height: 10px; background: var(--accent-soft); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .35s ease; }

/* Tabs + chips */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface); border: 1px solid var(--line); padding: 5px; border-radius: 14px; }
.tabs button { border: 0; background: transparent; padding: 10px 6px; border-radius: 10px; font: 700 16px var(--f-display); color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: thin; }
.chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.chip small { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .7; }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; }
.toolbar input, .toolbar select, .fopts select {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 12px; min-width: 0;
}
.toolbar input { flex: 1 1 220px; }
.count { color: var(--muted); font-size: 14px; align-self: center; }

/* Word cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); min-width: 0; }
.card.known { border-color: var(--good); }
.card .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.word { font: 800 28px/1.1 var(--f-display); margin: 0; overflow-wrap: anywhere; }
.meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.ipa { font-family: var(--f-ipa); background: var(--hl-bg); color: var(--hl-fg); padding: 1px 9px; border-radius: 6px; font-size: 15px; }
.pos { font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 7px; }
.vi { font-size: 19px; font-weight: 600; margin: 0; color: var(--accent); }
.ex { margin: 0; font-size: 14.5px; color: var(--ink); display: grid; gap: 2px; padding-left: 12px; border-left: 3px solid var(--line); }
.ex em { color: var(--muted); font-style: normal; }
.btns { display: flex; gap: 6px; flex: 0 0 auto; }
.ico { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--accent-soft); color: var(--accent); border-radius: 12px; min-width: 42px; height: 42px; padding: 0 10px; font-weight: 600; font-size: 13px; }
.ico:hover { border-color: var(--accent); }
.ico.playing { background: var(--accent); color: var(--accent-ink); }
.ico svg { width: 20px; height: 20px; fill: currentColor; }
.ico.sm { min-width: 34px; height: 34px; border-radius: 10px; }
.ico.sm svg { width: 16px; height: 16px; }
.card .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 4px; }
.know { border: 1px solid var(--line); background: transparent; padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; }
.know[aria-pressed="true"] { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; }

/* Flashcards */
.fwrap { display: grid; gap: 14px; justify-items: center; }
.fopts { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; font-size: 14px; color: var(--muted); }
.fopts label { display: inline-flex; align-items: center; gap: 6px; }
.fcount { font: 700 15px var(--f-display); color: var(--muted); font-variant-numeric: tabular-nums; }
.scene { width: min(560px, 100%); height: 340px; perspective: 1200px; }
.fc { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,.7,.2,1); cursor: pointer; }
.fc.flip { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; text-align: center; }
.face.back { transform: rotateY(180deg); }
.face .big { font: 800 clamp(40px, 11vw, 64px)/1 var(--f-display); overflow-wrap: anywhere; }
.face .ipa { font-size: 20px; padding: 2px 12px; }
.face .vi { font-size: clamp(26px, 6vw, 34px); font-family: var(--f-display); font-weight: 700; }
.face .hint { font-size: 13px; color: var(--muted); }
.face .ex { text-align: left; max-width: 420px; }
.fbtns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 11px 20px; border-radius: 12px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.good { background: var(--good-soft); color: var(--good); border-color: var(--good); }
.btn.bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* Quiz */
.quiz { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: clamp(16px, 4vw, 28px); box-shadow: var(--shadow); display: grid; gap: 18px; max-width: 640px; width: 100%; margin: 0 auto; }
.quiz h2 { font: 800 26px/1.1 var(--f-display); margin: 0; }
.quiz .opts { display: grid; gap: 10px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--bg); padding: 13px 16px; border-radius: 14px; font-size: 17px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.opt .ipa { font-size: 13px; }
.qtop { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
.qprompt { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.qprompt .word { font-size: 38px; }
.feedback { font-weight: 600; min-height: 1.5em; }
.score { font: 800 56px/1 var(--f-display); color: var(--accent); }
.review { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.review li { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 10px 12px; border-radius: 10px; background: var(--bad-soft); }
.field { display: grid; gap: 6px; }
.field label { font-weight: 600; font-size: 14px; }
.field select { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); z-index: 20; }
.note { font-size: 13px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { .fc, .bar i { transition: none; } }
@media (max-width: 480px) { .scene { height: 360px; } .word { font-size: 25px; } }
</style>
</head>
<body>


<div class="wrap">
  <header class="head">
    <div>
      <h1>Từ vựng <mark>TOEIC A1</mark></h1>
      <p>Học từ cơ bản kèm phiên âm IPA, giọng đọc, nghĩa tiếng Việt và câu ví dụ.</p>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Chọn giọng đọc">
        <button type="button" data-act="accent" data-v="en-US" aria-pressed="true">Giọng Mỹ</button>
        <button type="button" data-act="accent" data-v="en-GB" aria-pressed="false">Giọng Anh</button>
      </div>
    </div>
  </header>

  <section class="progress" aria-label="Tiến độ">
    <div class="row"><span>Đã thuộc <b id="pKnown">0</b> / <b id="pTotal">0</b> từ</span><span id="pPct"></span></div>
    <div class="bar"><i id="pBar" style="width:0%"></i></div>
  </section>

  <nav class="tabs" role="tablist" aria-label="Chế độ học">
    <button type="button" role="tab" data-act="tab" data-v="list" aria-selected="true">Danh sách</button>
    <button type="button" role="tab" data-act="tab" data-v="flash" aria-selected="false">Flashcard</button>
    <button type="button" role="tab" data-act="tab" data-v="quiz" aria-selected="false">Kiểm tra</button>
  </nav>

  <div class="chips" id="chips" role="group" aria-label="Chủ đề"></div>

  <main id="view"></main>
  <p class="note">Tiến độ "đã thuộc" được lưu ngay trong trình duyệt của bạn. Giọng đọc dùng giọng có sẵn trên thiết bị, nếu không nghe thấy hãy kiểm tra âm lượng.</p>
</div>
<div class="toast" id="toast" hidden></div>

var ALL = [];
DATA.forEach(function (t) {
  t.words = [];
  t.raw.trim().split('\n').forEach(function (line) {
    var p = line.split('|');
    var w = { i: ALL.length, w: p[0], ipa: p[1], pos: p[2], vi: p[3], ex: p[4], exvi: p[5], topic: t.id };
    ALL.push(w); t.words.push(w);
  });
});

/* ===== Trạng thái ===== */
var S = { tab: 'list', topic: 'all', q: '', status: 'all', accent: 'en-US', deck: [], di: 0, flip: false, auto: true, onlyNew: false, quiz: null, qmode: 'vi' };
var KEY = 'toeic-a1-known-v1';
var known = {};
try { known = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { known = {}; }
function saveKnown() { try { localStorage.setItem(KEY, JSON.stringify(known)); } catch (e) {} }

var $ = function (s) { return document.querySelector(s); };
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pool() { return S.topic === 'all' ? ALL : DATA.filter(function (t) { return t.id === S.topic; })[0].words; }
function topicName() { return S.topic === 'all' ? 'Tất cả chủ đề' : DATA.filter(function (t) { return t.id === S.topic; })[0].name; }

var SPK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';

/* ===== Giọng đọc ===== */
var voices = [];
function loadVoices() { if ('speechSynthesis' in window) voices = speechSynthesis.getVoices() || []; }
loadVoices();
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = loadVoices;
function pickVoice() {
  var want = S.accent.toLowerCase();
  var list = voices.filter(function (v) { return v.lang.replace('_', '-').toLowerCase() === want; });
  if (!list.length) list = voices.filter(function (v) { return v.lang.toLowerCase().indexOf(want.slice(0, 2)) === 0; });
  var pref = list.filter(function (v) { return /google|natural|samantha|daniel|serena|aria|jenny/i.test(v.name); });
  return (pref[0] || list[0]) || null;
}
var toastT;
function toast(msg) { var el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { el.hidden = true; }, 2600); }
function speak(text, rate, btn) {
  if (!('speechSynthesis' in window)) { toast('Trình duyệt này không hỗ trợ giọng đọc.'); return; }
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = S.accent; u.rate = rate || 0.9;
    var v = pickVoice(); if (v) u.voice = v;
    if (btn) { btn.classList.add('playing'); u.onend = u.onerror = function () { btn.classList.remove('playing'); }; }
    speechSynthesis.speak(u);
  } catch (e) { toast('Không phát được âm thanh trên thiết bị này.'); }
}

/* ===== Tiến độ + chip ===== */
function renderProgress() {
  var k = ALL.filter(function (w) { return known[w.w]; }).length;
  $('#pKnown').textContent = k; $('#pTotal').textContent = ALL.length;
  var pct = Math.round(k / ALL.length * 100);

  $('#pBar').style.width = pct + '%';
}

  var h = '<button type="button" class="chip" data-act="topic" data-v="all" aria-pressed="' + (S.topic === 'all') + '">Tất cả<small>' + ALL.length + '</small></button>';

    var k = t.words.filter(function (w) { return known[w.w]; }).length;
    h += '<button type="button" class="chip" data-act="topic" data-v="' + t.id + '" aria-pressed="' + (S.topic === t.id) + '">' + esc(t.name) + '<small>' + k + '/' + t.words.length + '</small></button>';
  });
  $('#chips').innerHTML = h;
}

/* ===== Danh sách ===== */
function listWords() {
  var q = S.q.trim().toLowerCase();
  return pool().filter(function (w) {
    if (S.status === 'known' && !known[w.w]) return false;
    if (S.status === 'new' && known[w.w]) return false;
    if (!q) return true;
    return w.w.toLowerCase().indexOf(q) > -1 || w.vi.toLowerCase().indexOf(q) > -1;
  });
}
function cardHtml(w) {
  return '<article class="card' + (known[w.w] ? ' known' : '') + '">' +
    '<div class="top"><div><h3 class="word">' + esc(w.w) + '</h3><div class="meta"><span class="ipa">/' + esc(w.ipa) + '/</span><span class="pos">' + esc(w.pos) + '</span></div></div>' +
    '<div class="btns"><button type="button" class="ico" data-act="say" data-i="' + w.i + '" aria-label="Nghe từ ' + esc(w.w) + '">' + SPK + '</button>' +
    '<button type="button" class="ico" data-act="slow" data-i="' + w.i + '" aria-label="Nghe chậm từ ' + esc(w.w) + '">Chậm</button></div></div>' +
    '<p class="vi">' + esc(w.vi) + '</p>' +
    '<p class="ex"><span>' + esc(w.ex) + '</span><em>' + esc(w.exvi) + '</em></p>' +
    '<div class="foot"><button type="button" class="ico sm" data-act="sayex" data-i="' + w.i + '" aria-label="Nghe câu ví dụ">' + SPK + '</button>' +
    '<button type="button" class="know" data-act="know" data-i="' + w.i + '" aria-pressed="' + (!!known[w.w]) + '">' + (known[w.w] ? 'Đã thuộc' : 'Đánh dấu đã thuộc') + '</button></div></article>';
}
function renderList() {
  var ws = listWords();
  var h = '<div class="toolbar"><input id="q" type="search" placeholder="Tìm từ tiếng Anh hoặc nghĩa tiếng Việt" value="' + esc(S.q) + '" aria-label="Tìm từ">' +
    '<select id="st" aria-label="Lọc trạng thái"><option value="all">Tất cả</option><option value="new">Chưa thuộc</option><option value="known">Đã thuộc</option></select>' +
    '<span class="count">' + ws.length + ' từ · ' + esc(topicName()) + '</span></div>';
  h += ws.length ? '<div class="grid" id="grid">' + ws.map(cardHtml).join('') + '</div>' : '<div class="empty">Không có từ nào khớp. Hãy đổi từ khóa hoặc bộ lọc.</div>';
  $('#view').innerHTML = h;
  $('#st').value = S.status;
}
function refreshGrid() {
  var ws = listWords();

  if (!ws.length) { renderList(); return; }
  if (!g) { renderList(); return; }
  g.innerHTML = html;
}

/* ===== Flashcard ===== */
function buildDeck(keepShuffle) {
  var p = pool().filter(function (w) { return !S.onlyNew || !known[w.w]; });

  S.di = 0; S.flip = false;
}

  if (!d.length) { $('#view').innerHTML = '<div class="fwrap">' + opts + '<div class="empty">Không còn từ nào để ôn trong chủ đề này. Bạn đã thuộc hết, hãy bỏ chọn "Chỉ từ chưa thuộc" để ôn lại.</div></div>'; return; }
  var w = d[S.di];
  var h = '<div class="fwrap">' + opts + '<div class="fcount">' + (S.di + 1) + ' / ' + d.length + ' · ' + esc(topicName()) + '</div>' +
    '<div class="scene"><div class="fc' + (S.flip ? ' flip' : '') + '" id="fc" data-act="flip" role="button" tabindex="0" aria-label="Lật thẻ">' +
    '<div class="face front"><div class="big">' + esc(w.w) + '</div><span class="ipa">/' + esc(w.ipa) + '/</span>' +
    '<button type="button" class="ico" data-act="say" data-i="' + w.i + '" aria-label="Nghe">' + SPK + ' Nghe</button><span class="hint">Chạm vào thẻ để xem nghĩa</span></div>' +
    '<div class="face back"><div class="vi">' + esc(w.vi) + '</div><span class="pos">' + esc(w.pos) + '</span>' +
    '<p class="ex"><span>' + esc(w.ex) + '</span><em>' + esc(w.exvi) + '</em></p>' +
    '<button type="button" class="ico sm" data-act="sayex" data-i="' + w.i + '" aria-label="Nghe câu ví dụ">' + SPK + '</button></div></div></div>' +
    '<div class="fbtns"><button type="button" class="btn" data-act="prev" ' + (S.di === 0 ? 'disabled' : '') + '>Trước</button>' +
    '<button type="button" class="btn bad" data-act="fnew" data-i="' + w.i + '">Chưa thuộc</button>' +
    '<button type="button" class="btn good" data-act="fknow" data-i="' + w.i + '">Đã thuộc</button>' +
    '<button type="button" class="btn primary" data-act="next" ' + (S.di === d.length - 1 ? 'disabled' : '') + '>Sau</button></div>' +
    '<div class="note">Phím tắt: Space để lật, mũi tên trái/phải để chuyển thẻ.</div></div>';
  $('#view').innerHTML = h;
  if (say && S.auto) speak(w.w, 0.85);
}
function goCard(n) {
  if (n < 0 || n >= S.deck.length) return;
  S.di = n; S.flip = false; renderFlash(true);
}

/* ===== Kiểm tra ===== */
function renderQuizSetup() {
  var n = pool().length;
  $('#view').innerHTML = '<div class="quiz"><h2>Kiểm tra nhanh</h2><p style="margin:0;color:var(--muted)">10 câu hỏi từ chủ đề: <b style="color:var(--ink)">' + esc(topicName()) + '</b>. Đổi chủ đề ở thanh phía trên.</p>' +
    '<div class="field"><label for="qm">Kiểu câu hỏi</label><select id="qm"><option value="vi">Xem từ tiếng Anh, chọn nghĩa tiếng Việt</option><option value="listen">Nghe phát âm, chọn từ tiếng Anh</option></select></div>' +
    '<button type="button" class="btn primary" data-act="qstart" ' + (n < 2 ? 'disabled' : '') + '>Bắt đầu</button></div>';
  $('#qm').value = S.qmode;
}
function startQuiz() {
  var items = shuffle(pool()).slice(0, 10);
  S.quiz = { items: items, i: 0, score: 0, wrong: [], done: false, answered: false, opts: [] };
  renderQuestion();
}
function makeOpts(w) {
  var others = shuffle(ALL.filter(function (x) { return x.w !== w.w && x.vi !== w.vi && x.pos === w.pos; }));
  if (others.length < 3) others = shuffle(ALL.filter(function (x) { return x.w !== w.w && x.vi !== w.vi; }));
  return shuffle([w].concat(others.slice(0, 3)));
}
function renderQuestion() {
  var q = S.quiz;
  if (q.i >= q.items.length) { return renderResult(); }
  var w = q.items[q.i]; q.answered = false; q.opts = makeOpts(w);
  var prompt = S.qmode === 'vi'
    ? '<div class="qprompt"><span class="word">' + esc(w.w) + '</span><span class="ipa">/' + esc(w.ipa) + '/</span><button type="button" class="ico" data-act="say" data-i="' + w.i + '" aria-label="Nghe">' + SPK + '</button></div><div>Nghĩa tiếng Việt của từ này là gì?</div>'
    : '<div class="qprompt"><button type="button" class="ico" data-act="say" data-i="' + w.i + '" aria-label="Nghe lại">' + SPK + ' Nghe lại</button><button type="button" class="ico" data-act="slow" data-i="' + w.i + '">Chậm</button></div><div>Bạn nghe thấy từ nào?</div>';
  var opts = q.opts.map(function (o, k) {
    return '<button type="button" class="opt" data-act="ans" data-k="' + k + '"><span>' + (S.qmode === 'vi' ? esc(o.vi) : esc(o.w)) + '</span>' + (S.qmode === 'vi' ? '' : '<span class="ipa">/' + esc(o.ipa) + '/</span>') + '</button>';
  }).join('');
  $('#view').innerHTML = '<div class="quiz"><div class="qtop"><span>Câu ' + (q.i + 1) + ' / ' + q.items.length + '</span><span>Đúng: ' + q.score + '</span></div>' +
    '<div class="bar"><i style="width:' + (q.i / q.items.length * 100) + '%"></i></div>' + prompt +
    '<div class="opts">' + opts + '</div><div class="feedback" id="fb" aria-live="polite"></div><div id="qnext"></div></div>';
  if (S.qmode === 'listen') speak(w.w, 0.85);
}
function answer(k) {
  var q = S.quiz; if (q.answered) return; q.answered = true;
  var w = q.items[q.i], pick = q.opts[k], ok = pick.w === w.w;
  if (ok) q.score++; else q.wrong.push(w);
  document.querySelectorAll('.opt').forEach(function (b, idx) {
    b.disabled = true;
    if (q.opts[idx].w === w.w) b.classList.add('right'); else if (idx === k) b.classList.add('wrong');
  });
  $('#fb').innerHTML = ok ? 'Chính xác!' : 'Đáp án đúng: <b>' + esc(w.w) + '</b> /' + esc(w.ipa) + '/ = ' + esc(w.vi);
  $('#fb').style.color = ok ? 'var(--good)' : 'var(--bad)';
  $('#qnext').innerHTML = '<button type="button" class="btn primary" data-act="qnext">' + (q.i === q.items.length - 1 ? 'Xem kết quả' : 'Câu tiếp theo') + '</button>';
  if (S.qmode === 'vi') speak(w.w, 0.9);
}
function renderResult() {
  var q = S.quiz, n = q.items.length;
  var msg = q.score === n ? 'Tuyệt vời, bạn đúng hết!' : q.score >= n * 0.7 ? 'Khá tốt. Ôn lại vài từ sai là xong.' : 'Cần ôn thêm. Hãy xem lại các từ bên dưới.';
  var rev = q.wrong.length ? '<h3 style="margin:0">Từ cần ôn lại</h3><ul class="review">' + q.wrong.map(function (w) {
    return '<li><b>' + esc(w.w) + '</b><span class="ipa">/' + esc(w.ipa) + '/</span><span>' + esc(w.vi) + '</span><button type="button" class="ico sm" data-act="say" data-i="' + w.i + '" aria-label="Nghe">' + SPK + '</button></li>';
  }).join('') + '</ul>' : '';
  $('#view').innerHTML = '<div class="quiz"><h2>Kết quả</h2><div class="score">' + q.score + '/' + n + '</div><p style="margin:0">' + msg + '</p>' + rev +
    '<div class="fbtns" style="justify-content:flex-start"><button type="button" class="btn primary" data-act="qstart">Làm lại</button><button type="button" class="btn" data-act="qreset">Đổi kiểu câu hỏi</button></div></div>';
  q.wrong.forEach(function (w) { delete known[w.w]; });
  saveKnown(); renderProgress(); renderChips();
}

/* ===== Điều khiển chung ===== */
function render(say) {
  renderProgress(); renderChips();
  document.querySelectorAll('.tabs button').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.v === S.tab); });
  if (S.tab === 'list') renderList();
  else if (S.tab === 'flash') { if (!S.deck.length || say === 'rebuild') buildDeck(false); renderFlash(false); }
  else { if (S.quiz && !S.quiz.done && say !== 'rebuild') renderQuestion(); else { S.quiz = null; renderQuizSetup(); } }
}
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  var a = el.dataset.act, i = el.dataset.i, w = i != null ? ALL[+i] : null;
  if (el.tagName === 'BUTTON' && el.closest('#fc') && a !== 'flip') e.stopPropagation();
  switch (a) {
    case 'accent': S.accent = el.dataset.v; document.querySelectorAll('[data-act="accent"]').forEach(function (b) { b.setAttribute('aria-pressed', b === el); }); if (!voices.length) loadVoices(); toast(S.accent === 'en-US' ? 'Đã chọn giọng Mỹ' : 'Đã chọn giọng Anh'); break;
    case 'tab': S.tab = el.dataset.v; S.quiz = null; if (S.tab === 'flash') buildDeck(false); render(); break;
    case 'topic': S.topic = el.dataset.v; S.quiz = null; buildDeck(false); render('rebuild'); break;
    case 'say': speak(w.w, 0.9, el); break;
    case 'slow': speak(w.w, 0.55, el); break;
    case 'sayex': speak(w.ex, 0.85, el); break;
    case 'know': known[w.w] = !known[w.w]; if (!known[w.w]) delete known[w.w]; saveKnown(); renderProgress(); renderChips(); if (S.status === 'all') { var card = el.closest('.card'); card.classList.toggle('known', !!known[w.w]); el.setAttribute('aria-pressed', !!known[w.w]); el.textContent = known[w.w] ? 'Đã thuộc' : 'Đánh dấu đã thuộc'; } else refreshGrid(); break;
    case 'flip': S.flip = !S.flip; $('#fc').classList.toggle('flip', S.flip); break;
    case 'prev': goCard(S.di - 1); break;
    case 'next': goCard(S.di + 1); break;
    case 'fknow': known[w.w] = true; saveKnown(); renderProgress(); renderChips(); if (S.di < S.deck.length - 1) goCard(S.di + 1); else toast('Đã hết bộ thẻ.'); break;
    case 'fnew': delete known[w.w]; saveKnown(); renderProgress(); renderChips(); if (S.di < S.deck.length - 1) goCard(S.di + 1); else toast('Đã hết bộ thẻ.'); break;
    case 'shuffle': buildDeck(true); renderFlash(true); break;
    case 'qstart': S.qmode = ($('#qm') || { value: S.qmode }).value; startQuiz(); break;
    case 'qreset': S.quiz = null; renderQuizSetup(); break;
    case 'ans': answer(+el.dataset.k); break;
    case 'qnext': S.quiz.i++; renderQuestion(); break;
  }
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'q') { S.q = e.target.value; refreshGrid(); }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'st') { S.status = e.target.value; refreshGrid(); }
  if (e.target.id === 'auto') S.auto = e.target.checked;
  if (e.target.id === 'onlyNew') { S.onlyNew = e.target.checked; buildDeck(false); renderFlash(false); }
  if (e.target.id === 'qm') S.qmode = e.target.value;
});
document.addEventListener('keydown', function (e) {
  if (S.tab !== 'flash') return;
  var t = e.target.tagName; if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') goCard(S.di + 1);
  else if (e.key === 'ArrowLeft') goCard(S.di - 1);
  else if (e.key === ' ' && S.deck.length) { e.preventDefault(); S.flip = !S.flip; $('#fc').classList.toggle('flip', S.flip); }
});
render();
</script>

</body>
</html>
