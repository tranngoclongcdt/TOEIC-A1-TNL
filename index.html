appraise|əˈpreɪz|v|thẩm định giá trị (tài sản, bất động sản)|A specialist was hired to appraise the value of the estate.|Một chuyên gia đã được thuê để thẩm định giá trị của khối bất động sản.

• Động từ To be: Am / Is / Are + S + ...?`},usages:["Diễn tả hoạt động thường xuyên, định kỳ ở công ty (họp hàng tuần, báo cáo hàng tháng).","Diễn tả quy định, chính sách hiện hành của doanh nghiệp, sự thật hiển nhiên.","Diễn tả lịch trình cố định (chuyến bay, tàu hỏa, lịch khai mạc hội nghị) dù mang nghĩa tương lai.","Dùng trong mệnh đề thời gian/điều kiện (sau if, when, as soon as, before, after, once, unless) để chỉ tương lai!"],signals:["always (luôn luôn), usually (thường xuyên), often, frequently, regularly, generally (nhìn chung)","every day / week / month / quarter / year (mỗi ngày / tuần / tháng / quý / năm)","annually (hàng năm), monthly (hàng tháng), weekly, daily, periodically (định kỳ)","on Mondays, twice a week, once a month"],toeicTips:['🔥 BẪY SỐ 1 TOEIC: Trong mệnh đề bắt đầu bằng "When / Before / After / As soon as / Once / If / Unless", TUYỆT ĐỐI KHÔNG dùng "will + V", mà phải lùi về HIỆN TẠI ĐƠN (V / V-s/es)!','🔥 BẪY CHỦ NGỮ SỐ ÍT: Chủ ngữ là "Each / Every / Anyone / The number of / V-ing / Danh từ không đếm được (information, equipment, luggage, furniture)" -> Động từ luôn chia SỐ ÍT (thêm -s/es, dùng is/has).'],examples:[{en:"The board of directors meets every Monday to review sales.",vi:"Hội đồng quản trị họp vào mỗi thứ Hai để xem xét doanh số.",note:'Có "every Monday" + chủ ngữ chính là "The board" (số ít) -> meets.'},{en:"Once the manager approves the budget, we will start the project.",vi:"Một khi giám đốc phê duyệt ngân sách, chúng tôi sẽ bắt đầu dự án.",note:'Sau liên từ thời gian "Once", dùng Hiện tại đơn (approves) chứ không dùng will approve.'}]},{id:"present_continuous",category:"tense",group:"Hiện tại",title:"2. Thì Hiện Tại Tiếp Diễn",enTitle:"Present Continuous",isCoreToeic:!0,toeicFreq:"⭐⭐⭐⭐⭐ Nền tảng Part 1 & Part 5",summary:"Diễn tả hành động đang diễn ra ngay lúc nói (chiếm 90% câu mô tả tranh Part 1) hoặc kế hoạch sắp xảy ra.",formulas:{aff:"S + am / is / are + V-ing",neg:"S + am / is / are + not + V-ing",ques:"Am / Is / Are + S + V-ing?"},usages:["Hành động đang xảy ra ngay tại thời điểm nói hoặc xung quanh thời điểm nói (dự án đang triển khai).","Mô tả hành động của người/vật trong tranh ở TOEIC Listening Part 1.","Kế hoạch đã được lên lịch chắc chắn trong tương lai gần."],signals:["now, right now, at the moment, at present","currently (hiện tại - từ khóa vàng trong TOEIC Part 5!)","presently, temporarily (tạm thời), Look!, Listen!"],toeicTips:['🔥 MẸO 3 GIÂY PART 5: Thấy trạng từ "currently" đứng giữa "am/is/are _______" -> Chọn ngay V-ing (nếu chủ động) hoặc being V3/ed (nếu bị động)!',"⚠️ ĐỘNG TỪ KHÔNG CHIA TIẾP DIỄN: Các động từ chỉ nhận thức/sở hữu (know, understand, believe, belong to, own, have = sở hữu, need, want, seem, contain) KHÔNG dùng V-ing."],examples:[{en:"Our technicians are currently upgrading the internal server.",vi:"Các kỹ thuật viên của chúng tôi hiện đang nâng cấp máy chủ nội bộ.",note:'Có "currently" + có tân ngữ "the internal server" -> are upgrading.'},{en:"The main lobby is currently being renovated.",vi:"Sảnh chính hiện đang được cải tạo.",note:"Bị động hiện tại tiếp diễn (is being + V3/ed) — cực hay bẫy trong cả Part 1 và Part 5."}]},{id:"present_perfect",category:"tense",group:"Hiện tại",title:"3. Thì Hiện Tại Hoàn Thành",enTitle:"Present Perfect",isCoreToeic:!0,toeicFreq:"⭐⭐⭐⭐⭐ Vua của các thì trong TOEIC",summary:"Diễn tả hành động bắt đầu trong quá khứ, kéo dài đến hiện tại (hoặc vừa mới xảy ra, hoặc để lại kết quả ở hiện tại).",formulas:{aff:"S + have / has + V3/ed",neg:"S + have / has + not (haven’t / hasn’t) + V3/ed",ques:"Have / Has + S + V3/ed?"},usages:["Hành động bắt đầu trong quá khứ và vẫn còn tiếp tục ở hiện tại (đi với since / for / over the past...).","Hành động vừa mới xảy ra (just, recently, lately) hoặc chưa xảy ra tính đến nay (yet).","Trải nghiệm hoặc thành tựu tính đến thời điểm hiện tại (so far, up to now)."],signals:["since + mốc thời gian (since 2020, since last month) / since + S + V2/ed","for + khoảng thời gian (for 5 years, for over a decade)","over / during / in the past (hoặc last) + số năm (over the past 3 years)","recently, lately (gần đây), already, just, yet, ever, never","so far, up to now, until now, to date (tính đến nay)"],toeicTips:["🔥 CÔNG THỨC VÀNG TOEIC: [Hiện tại hoàn thành (have/has + V3/ed)] + SINCE + [Quá khứ đơn (V2/ed)]. Đề thi cực hay đục lỗ 1 trong 2 vế này!",'🔥 Đừng nhầm "last year" (Quá khứ đơn) với "in the last year / over the past year" (trong suốt 1 năm qua -> Hiện tại hoàn thành)!'],examples:[{en:"Sales have increased by 25 percent over the past six months.",vi:"Doanh số đã tăng 25% trong suốt 6 tháng qua.",note:'Dấu hiệu "over the past six months" -> chọn ngay have increased.'},{en:"Ms. Kim has managed the Tokyo branch since she joined the firm in 2019.",vi:"Bà Kim đã quản lý chi nhánh Tokyo kể từ khi bà gia nhập công ty năm 2019.",note:'Trước "since" là has managed (HTHT), sau "since" là joined (QKĐ).'}]},{id:"present_perfect_continuous",category:"tense",group:"Hiện tại",title:"4. Thì Hiện Tại Hoàn Thành Tiếp Diễn",enTitle:"Present Perfect Continuous",isCoreToeic:!1,toeicFreq:"⭐⭐⭐ Thỉnh thoảng xuất hiện",summary:"Nhấn mạnh tính LIÊN TỤC không ngắt quãng của một hành động bắt đầu từ quá khứ và ngay lúc này vẫn đang tiếp diễn.",formulas:{aff:"S + have / has + been + V-ing",neg:"S + have / has + not + been + V-ing",ques:"Have / Has + S + been + V-ing?"},usages:["Nhấn mạnh quá trình liên tục kéo dài (VD: chờ đợi suốt 2 tiếng, đàm phán suốt cả tuần nay và giờ vẫn đang đàm phán)."],signals:["all day, all morning, all week","for + khoảng thời gian + (and still...)","since + mốc thời gian (khi muốn nhấn mạnh đang làm liên tục)"],toeicTips:['💡 Trong đề TOEIC, nếu câu có "for/since" mà đáp án có cả HTHT và HTHT Tiếp diễn, hãy xem động từ có chia V-ing được không và có tân ngữ không (Lưu ý: "have been V-ing" là CHỦ ĐỘNG, còn "have been V3/ed" là BỊ ĐỘNG của Hiện tại hoàn thành!).'],examples:[{en:"We have been negotiating the contract terms for three weeks.",vi:"Chúng tôi đã và đang đàm phán các điều khoản hợp đồng suốt 3 tuần qua.",note:"Nhấn mạnh hành động đàm phán diễn ra liên tục đến tận bây giờ."}]},{id:"past_simple",category:"tense",group:"Quá khứ",title:"5. Thì Quá Khứ Đơn",enTitle:"Past Simple",isCoreToeic:!0,toeicFreq:"⭐⭐⭐⭐⭐ Cực hay ra thi",summary:"Diễn tả hành động đã xảy ra và CHẤM DỨT HOÀN TOÀN tại một thời điểm xác định trong quá khứ.",formulas:{aff:`• Động từ thường: S + V2/ed
• Động từ To be: S + was / were`,neg:`• Động từ thường: S + did not (didn’t) + V(nguyên mẫu)
• Động từ To be: S + was / were + not`,ques:`• Động từ thường: Did + S + V(nguyên mẫu)?
• Động từ To be: Was / Were + S + ...?`},usages:["Sự việc đã hoàn tất trong quá khứ có thời gian cụ thể (hôm qua, tuần trước, năm 2022).","Chuỗi hành động xảy ra nối tiếp nhau trong quá khứ.",'Đứng ngay sau "since" trong cấu trúc: HTHT + since + QKĐ.'],signals:["yesterday, the day before yesterday","last night / week / month / quarter / year","khoảng thời gian + ago (two days ago, a decade ago)","in + năm quá khứ (in 1998, in 2021), previously, formerly (trước đây)"],toeicTips:['🔥 MẸO NHÌN NHANH: Thấy "last...", "...ago", "yesterday", "in 2020", "previously", "formerly" -> Gạt bỏ hết các đáp án có have/has/will, chọn ngay V2/ed (hoặc was/were + V3/ed nếu bị động)!'],examples:[{en:"The company launched its flagship smartphone two months ago.",vi:"Công ty đã ra mắt mẫu điện thoại chủ lực cách đây hai tháng.",note:'Có "two months ago" -> dùng Quá khứ đơn (launched).'},{en:"Mr. Tanaka formerly served as the Vice President of Finance.",vi:"Ông Tanaka trước đây từng giữ chức Phó Chủ tịch Tài chính.",note:'Trạng từ "formerly" (trước đây) là dấu hiệu kinh điển của thì Quá khứ đơn.'}]},{id:"past_continuous",category:"tense",group:"Quá khứ",title:"6. Thì Quá Khứ Tiếp Diễn",enTitle:"Past Continuous",isCoreToeic:!1,toeicFreq:"⭐⭐⭐ Nền tảng phối hợp thì",summary:"Diễn tả hành động đang diễn ra tại một thời điểm cụ thể trong quá khứ, hoặc đang diễn ra thì có hành động khác cắt ngang.",formulas:{aff:"S + was / were + V-ing",neg:"S + was / were + not + V-ing",ques:"Was / Were + S + V-ing?"},usages:["Hành động đang xảy ra (was/were V-ing) thì hành động ngắn xen vào (V2/ed).","Hành động đang diễn ra tại một giờ xác định trong quá khứ (at 9 A.M. yesterday)."],signals:["at + giờ + thời gian quá khứ (at 10:00 last night)","at this time yesterday / last week","while (trong khi + was/were V-ing), when (khi + V2/ed)"],toeicTips:['💡 Cấu trúc kinh điển: "While + S + was/were V-ing, S + V2/ed" (Đang làm gì thì việc khác bất ngờ xảy ra).'],examples:[{en:"The power went out while we were presenting the quarterly report.",vi:"Điện bị mất trong khi chúng tôi đang thuyết trình báo cáo quý.",note:"Đang thuyết trình (were presenting) thì mất điện (went out) cắt ngang."}]},{id:"past_perfect",category:"tense",group:"Quá khứ",title:"7. Thì Quá Khứ Hoàn Thành",enTitle:"Past Perfect",isCoreToeic:!0,toeicFreq:'⭐⭐⭐⭐ Rất hay ra ở câu có "By the time"',summary:"Diễn tả một hành động xảy ra và hoàn tất TRƯỚC một hành động khác trong quá khứ (Quá khứ của quá khứ).",formulas:{aff:"S + had + V3/ed",neg:"S + had not (hadn’t) + V3/ed",ques:"Had + S + V3/ed?"},usages:["Hành động xảy ra trước (had V3/ed), hành động xảy ra sau (V2/ed).","Dùng trong Câu điều kiện loại 3 (If + S + had V3/ed, S + would have V3/ed)."],signals:["by the time + S + V2/ed (vào lúc ai đó đã làm gì...)","before + mốc quá khứ / S + V2/ed","after + S + had V3/ed, S + V2/ed","prior to + thời điểm quá khứ"],toeicTips:['🔥 CÔNG THỨC 3 GIÂY: Thấy "By the time + S + V2/ed (Quá khứ đơn)" -> Vế còn lại chọn ngay "HAD + V3/ed" (Quá khứ hoàn thành)!'],examples:[{en:"By the time the technician arrived, the staff had already fixed the printer.",vi:"Vào lúc kỹ thuật viên đến nơi, nhân viên đã sửa xong chiếc máy in rồi.",note:'Có "By the time + arrived (V2/ed)" -> vế chính dùng had fixed.'}]},{id:"past_perfect_continuous",category:"tense",group:"Quá khứ",title:"8. Thì Quá Khứ Hoàn Thành Tiếp Diễn",enTitle:"Past Perfect Continuous",isCoreToeic:!1,toeicFreq:"⭐⭐ Ít gặp (Biết để đọc hiểu Part 7)",summary:"Nhấn mạnh quá trình kéo dài liên tục của một hành động xảy ra TRƯỚC một hành động khác trong quá khứ.",formulas:{aff:"S + had + been + V-ing",neg:"S + had + not + been + V-ing",ques:"Had + S + been + V-ing?"},usages:["Làm việc gì liên tục trong bao lâu (for...) tính đến trước một mốc quá khứ."],signals:["for + khoảng thời gian + before + S + V2/ed"],toeicTips:['💡 Chỉ chọn "had been V-ing" khi câu có cả mốc quá khứ (V2/ed) LẪN khoảng thời gian liên tục (for 3 hours / for 10 years before...).'],examples:[{en:"She had been working at the bank for ten years before she was promoted.",vi:"Cô ấy đã làm việc liên tục tại ngân hàng suốt 10 năm trước khi được thăng chức.",note:"Kéo dài 10 năm tính đến trước thời điểm được thăng chức trong quá khứ."}]},{id:"future_simple",category:"tense",group:"Tương lai",title:"9. Thì Tương Lai Đơn & Tương Lai Gần",enTitle:"Future Simple (will / be going to)",isCoreToeic:!0,toeicFreq:"⭐⭐⭐⭐⭐ Cực hay ra thi",summary:"Diễn tả sự việc sẽ xảy ra trong tương lai, thông báo kế hoạch, dự đoán hoặc lời hứa trong email thương mại.",formulas:{aff:`• Will: S + will + V(nguyên mẫu)
• Dự định: S + am / is / are + going to + V(nguyên mẫu)`,neg:"• S + will not (won’t) + V(nguyên mẫu)",ques:"• Will + S + V(nguyên mẫu)?"},usages:["Thông báo lịch trình, sự kiện sắp diễn ra (next week, tomorrow, upcoming).","Lời hứa, đề nghị hỗ trợ khách hàng (We will contact you shortly).","Mệnh đề chính của Câu điều kiện loại 1 (If + S + V(s/es), S + will + V)."],signals:["tomorrow, tonight, soon, shortly (ngay sau đây)","next week / month / quarter / year","in + khoảng thời gian (in two days = 2 ngày nữa), in + năm tương lai","upcoming, forthcoming (sắp tới)"],toeicTips:['🔥 NHỚ KỸ: "Shortly" trong TOEIC không phải là "ngắn gọn" (briefly) mà có nghĩa là "SỚM / NGAY SAU ĐÂY" (= soon) -> Đi với thì Tương lai (will + V)!'],examples:[{en:"A customer service representative will assist you shortly.",vi:"Nhân viên chăm sóc khách hàng sẽ hỗ trợ bạn ngay sau đây.",note:'Có "shortly" (= soon) -> chọn will assist.'}]},{id:"future_continuous",category:"tense",group:"Tương lai",title:"10. Thì Tương Lai Tiếp Diễn",enTitle:"Future Continuous",isCoreToeic:!1,toeicFreq:"⭐⭐⭐ Thỉnh thoảng gặp",summary:"Diễn tả hành động sẽ đang diễn ra tại một thời điểm xác định trong tương lai.",formulas:{aff:"S + will + be + V-ing",neg:"S + will + not + be + V-ing",ques:"Will + S + be + V-ing?"},usages:["Hành động đang diễn ra vào một giờ cụ thể ngày mai/tuần tới."],signals:["at + giờ + tomorrow / next week (at 10 A.M. tomorrow)","at this time tomorrow / next Monday"],toeicTips:['💡 Cẩn thận phân biệt "will be + V-ing" (Chủ động tương lai tiếp diễn) với "will be + V3/ed" (Bị động tương lai đơn - xuất hiện nhiều gấp 10 lần trong TOEIC!).'],examples:[{en:"At this time tomorrow, our team will be flying to Singapore.",vi:"Vào giờ này ngày mai, nhóm chúng tôi sẽ đang trên chuyến bay tới Singapore.",note:'Thời điểm xác định trong tương lai "At this time tomorrow".'}]},{id:"future_perfect",category:"tense",group:"Tương lai",title:"11. Thì Tương Lai Hoàn Thành",enTitle:"Future Perfect",isCoreToeic:!0,toeicFreq:"⭐⭐⭐⭐ Câu phân loại 650+ TOEIC",summary:"Diễn tả một hành động sẽ HOÀN TẤT TRƯỚC một thời điểm hoặc một hành động khác trong tương lai.",formulas:{aff:"S + will + have + V3/ed",neg:"S + will + not + have + V3/ed",ques:"Will + S + have + V3/ed?"},usages:["Hoàn thành xong mục tiêu/dự án trước một mốc thời gian tương lai (trước cuối tháng này, trước năm 2030)."],signals:["by + mốc thời gian tương lai (by tomorrow, by next Friday, by the end of this year)","by the time + S + V(s/es) [Hiện tại đơn]"],toeicTips:[`🔥 BỘ ĐÔI KINH ĐIỂN TRONG PART 5:
• By the time + S + V2/ed (Quá khứ) -> chọn HAD + V3/ed.
• By the time + S + V(s/es) (Hiện tại) -> chọn WILL HAVE + V3/ed!`],examples:[{en:"By the end of this month, Mr. Lee will have worked here for 20 years.",vi:"Tính đến cuối tháng này, ông Lee sẽ làm việc ở đây tròn 20 năm.",note:'Có "By the end of this month" (tương lai) -> will have worked.'}]},{id:"future_perfect_continuous",category:"tense",group:"Tương lai",title:"12. Thì Tương Lai Hoàn Thành Tiếp Diễn",enTitle:"Future Perfect Continuous",isCoreToeic:!1,toeicFreq:"⭐⭐ Hiếm gặp",summary:"Nhấn mạnh tính liên tục của một hành động kéo dài được bao lâu tính đến một mốc thời gian trong tương lai.",formulas:{aff:"S + will + have + been + V-ing",neg:"S + will + not + have + been + V-ing",ques:"Will + S + have + been + V-ing?"},usages:["Giống Tương lai hoàn thành nhưng nhấn mạnh sự liên tục (for + khoảng thời gian + by + mốc tương lai)."],signals:["by... + for + khoảng thời gian"],toeicTips:['💡 Trong bài thi TOEIC, hầu hết các câu có "By + mốc tương lai" đều chọn "will have V3/ed" (Tương lai hoàn thành).'],examples:[{en:"By next June, we will have been operating this factory for five years.",vi:"Tính đến tháng Sáu tới, chúng tôi sẽ vận hành nhà máy này liên tục được 5 năm.",note:'Kết hợp "By next June" + "for five years".'}]},{id:"core_word_form",category:"core",group:"Chuyên đề TOEIC",title:"Chuyên đề 1: Từ Loại (Danh - Động - Tính - Trạng)",enTitle:"Word Form (Chiếm ~10 câu mỗi đề Part 5!)",isCoreToeic:!0,toeicFreq:"⭐⭐⭐⭐⭐ Dạng bài kiếm điểm nhanh nhất",summary:"Nhận diện vị trí trống cần điền Danh từ (N), Động từ (V), Tính từ (Adj) hay Trạng từ (Adv) chỉ bằng cách nhìn từ đứng trước và sau chỗ trống — không cần dịch cả câu!",formulas:{aff:"Mạo từ (a/an/the) / Sở hữu (my, his, company’s) + [Adv] + [Adj] + [DANH TỪ]",neg:"To be / Become / Remain / Seem / Find O + [Adv] + [TÍNH TỪ]",ques:"Trợ động từ (have/has/will/can/be) + [TRẠNG TỪ -ly] + Động từ chính (V / V3-ed / V-ing)"},usages:["📌 KHI NÀO ĐIỀN DANH TỪ (N): Đứng sau a/an/the, tính từ sở hữu (his, our, their), tính từ (effective + N), hoặc sau giới từ (of, in, for, with + N). Đuôi Danh từ: -tion, -sion, -ment, -ness, -ity, -ance, -ence, -cy, -er/-or/-ist/-ant (chỉ người).","📌 KHI NÀO ĐIỀN TÍNH TỪ (Adj): Đứng ngay trước Danh từ (Adj + N) hoặc đứng sau các động từ nối (be, become, remain, stay, seem, look, feel) và cấu trúc (make/keep/find + O + Adj). Đuôi Tính từ: -ive, -ous, -able, -ible, -ful, -less, -al, -ic, -ant, -ent.","📌 KHI NÀO ĐIỀN TRẠNG TỪ (Adv - đuôi -ly): Đứng đầu câu trước dấu phẩy, đứng trước Tính từ (extremely useful), hoặc đứng cạnh Động từ thường (giữa trợ động từ và V chính: has successfully completed)."],signals:["Đuôi Danh từ vật: -tion, -ment, -ness, -ity, -ance, -ence, -al (proposal, approval, arrival, renewal)","Đuôi Tính từ: -ive (effective), -able (reliable), -ous (spacious), -ful, -al, -ic","Đuôi Trạng từ: Tính từ + -ly (Ngoại lệ: friendly, costly, timely, likely là TÍNH TỪ!)"],toeicTips:['🔥 BẪY DANH TỪ ĐUÔI -AL: Các từ "approval (sự phê duyệt), proposal (bản đề xuất), arrival (sự đến), renewal (sự gia hạn), removal (sự dỡ bỏ), trial (sự thử nghiệm)" nhìn giống tính từ nhưng là DANH TỪ 100%!',"🔥 BẪY DANH TỪ GHÉP: Nếu sau chỗ trống đã có 1 Danh từ, hãy cẩn thận các cụm Danh từ ghép cố định trong TOEIC như: safety regulations (quy định an toàn), customer satisfaction, performance evaluation, expiration date, registration fee."],examples:[{en:"The new software has significantly improved our team’s productivity.",vi:"Phần mềm mới đã cải thiện đáng kể năng suất của nhóm chúng tôi.",note:'Giữa "has" và "improved" (V3) -> điền Trạng từ (significantly). Sau sở hữu cách "team’s" -> điền Danh từ (productivity).'},{en:"You must obtain written approval from the director before purchasing.",vi:"Bạn phải có được sự phê duyệt bằng văn bản từ giám đốc trước khi mua hàng.",note:'Sau tính từ "written" và trước giới từ "from" -> cần Danh từ (approval).'}]},{id:"core_passive",category:"core",group:"Chuyên đề TOEIC",title:"Chuyên đề 2: Câu Bị Động (Passive Voice)",enTitle:"Passive Voice (be + V3/ed)",isCoreToeic:!0,toeicFreq:"⭐⭐⭐⭐⭐ Luôn có 3–4 câu mỗi đề",summary:"Dùng khi chủ ngữ (thường là vật: hợp đồng, báo cáo, kiện hàng, hội nghị) ĐƯỢC hoặc BỊ tác động bởi ai đó.",formulas:{aff:"Tổng quát: S + BE (chia theo thì) + V3/ed (+ by O)",neg:"Hiện tại/Quá khứ: am/is/are/was/were + V3/ed  |  Hoàn thành: have/has/had + BEEN + V3/ed",ques:"Tương lai / Modal: will / can / must / should + BE + V3/ed"},usages:["Khi chủ ngữ là vật (The contract, The package, The meeting) không thể tự thực hiện hành động.","Khi ngay sau chỗ trống KHÔNG CÓ TÂN NGỮ (Danh từ), mà lại là Giới từ (by, in, at, on, to, for, with), Trạng từ, hoặc dấu chấm hết câu!"],signals:["by + tác nhân (by the manager, by Friday)","Chỗ trống + giới từ (in, at, to, for, with, from) -> 90% là BỊ ĐỘNG!"],toeicTips:[`🔥 MẸO VÀNG 3 GIÂY: Nhìn ngay sau chỗ trống động từ:
1. Nếu CÓ Cụm Danh Từ (Tân ngữ) -> Chọn CHỦ ĐỘNG.
2. Nếu gặp Giới từ (in, on, at, by, to, with) hoặc Hết câu -> Chọn BỊ ĐỘNG (be + V3/ed)!`,'⚠️ NGOẠI LỆ CỰC QUAN TRỌNG: Các nội động từ "occur, happen, take place (diễn ra), remain, consist of, belong to, arrive, depart, expire (hết hạn), rise, fall" KHÔNG BAO GIỜ chia bị động dù sau nó là giới từ!'],examples:[{en:"All travel expense reports must be submitted by Friday afternoon.",vi:"Tất cả báo cáo chi phí công tác phải được nộp trước chiều thứ Sáu.",note:'Chủ ngữ là vật (reports) + sau chỗ trống là giới từ "by" -> bị động (must be submitted).'},{en:"The annual shareholders meeting will take place in Chicago next month.",vi:"Cuộc họp cổ đông thường niên sẽ diễn ra tại Chicago vào tháng tới.",note:'"take place" (diễn ra) là nội động từ -> LUÔN DÙNG CHỦ ĐỘNG (will take place), tuyệt đối không chọn will be taken place!'}]},{id:"core_conditionals",category:"core",group:"Chuyên đề TOEIC",title:"Chuyên đề 3: Câu Điều Kiện & Đảo Ngữ (Should / Were / Had)",enTitle:"Conditionals & Inversion",isCoreToeic:!0,toeicFreq:"⭐⭐⭐⭐ Rất hay ra ở Email Part 6 & Part 5",summary:'Nắm vững 3 loại câu điều kiện If và 3 cấu trúc Đảo ngữ mất "If" cực kỳ phổ biến trong thư tín thương mại TOEIC.',formulas:{aff:"Loại 1 (Có thật ở HT/TL): If + S + V(s/es), S + will / can / please + V_nguyên mẫu",neg:"Loại 2 (Trái với Hiện tại): If + S + V2/ed (were), S + would / could + V_nguyên mẫu",ques:"Loại 3 (Trái với Quá khứ): If + S + had + V3/ed, S + would / could + have + V3/ed"},usages:['Đảo ngữ Loại 1 (Rất hay gặp cuối email TOEIC!): "Should + S + V_nguyên mẫu, ..." (= If + S + V).','Đảo ngữ Loại 2: "Were + S + (to V), S + would + V_nguyên mẫu".','Đảo ngữ Loại 3: "Had + S + (not) + V3/ed, S + would have + V3/ed".'],signals:["If, Unless (= If... not), Provided that, As long as, In case",'Đầu câu có chỗ trống + S + V_nguyên mẫu, vế sau có "please + V / will + V" -> Chọn ngay SHOULD!','Đầu câu có chỗ trống + S + V3/ed, vế sau có "would have V3/ed" -> Chọn ngay HAD!'],toeicTips:['🔥 CÂU TỦ TOEIC: "_______ you have any further questions, please do not hesitate to contact us." -> Nhìn thấy "have" (nguyên mẫu) và "please contact" -> Chọn ngay "Should" trong 1 giây!'],examples:[{en:"Should you require any further assistance, please call our hotline.",vi:"Nếu bạn cần bất kỳ sự hỗ trợ nào thêm, vui lòng gọi đường dây nóng của chúng tôi.",note:"Đảo ngữ câu điều kiện loại 1: Should + S + V_nguyên mẫu."},{en:"Had we received your order earlier, we would have shipped it yesterday.",vi:"Giá như chúng tôi nhận được đơn hàng của bạn sớm hơn, chúng tôi đã giao nó vào hôm qua rồi.",note:"Đảo ngữ câu điều kiện loại 3: Had + S + V3/ed, S + would have V3/ed."}]},{id:"core_sv_agreement",category:"core",group:"Chuyên đề TOEIC",title:"Chuyên đề 4: Sự Hòa Hợp Chủ Ngữ & Động Từ",enTitle:"Subject–Verb Agreement",isCoreToeic:!0,toeicFreq:"⭐⭐⭐⭐⭐ Bẫy kinh điển Part 5",summary:"Đề thi TOEIC thường chèn một cụm giới từ dài ở giữa Chủ ngữ chính và Động từ để đánh lừa bạn chia sai số ít / số nhiều.",formulas:{aff:"N1 + (of / in / at / with / along with + N2) + Động từ chia theo N1!",neg:"The number of + N_số nhiều + V_SỐ ÍT  |  A number of + N_số nhiều + V_SỐ NHIỀU",ques:"Either A or B / Neither A nor B / Not only A but also B + V chia theo B (chủ ngữ gần nhất)"},usages:['Khi chủ ngữ có cụm giới từ bổ nghĩa (VD: The quality of these products IS high) -> Bỏ qua cụm "of these products", chia theo "The quality" (số ít).',"Các từ luôn đi với động từ SỐ ÍT: Each, Every, Anyone, Everyone, Someone, Nobody, One of the + N_nhiều + V_ít.","Chủ ngữ là V-ing hoặc Mệnh đề danh từ (What/That...) -> Động từ luôn chia SỐ ÍT."],signals:["Cụm giới từ xen giữa: N1 + of / from / in / for + N2 + _______","The number of (Con số -> V ít) vs. A number of (Nhiều -> V nhiều)","Along with, together with, as well as, accompanied by (Chia theo chủ ngữ ĐẦU TIÊN)"],toeicTips:["🔥 MẸO GẠCH BỎ RÁC: Khi tìm chủ ngữ cho động từ, hãy gạch bỏ toàn bộ các cụm bắt đầu bằng giới từ (of..., in..., for..., with...) đứng trước động từ. Danh từ đứng ĐẦU TIÊN trước giới từ mới là Chủ ngữ thật!"],examples:[{en:"The list of approved contractors was posted on the internal website.",vi:"Danh sách các nhà thầu được phê duyệt đã được đăng trên trang web nội bộ.",note:'Chủ ngữ chính là "The list" (số ít), không phải "contractors" -> dùng was.'},{en:"The manager, along with two assistants, is attending the trade fair.",vi:"Vị giám đốc, cùng với hai trợ lý, đang tham dự hội chợ thương mại.",note:'Có "along with...", động từ chia theo chủ ngữ đầu tiên "The manager" -> is.'}]},{id:"core_relative",category:"core",group:"Chuyên đề TOEIC",title:"Chuyên đề 5: Mệnh Đề Quan Hệ & Rút Gọn (V-ing / V3-ed)",enTitle:"Relative Clauses & Reduction",isCoreToeic:!0,toeicFreq:"⭐⭐⭐⭐ Câu hỏi phân loại 600–850+",summary:"Cách chọn nhanh đại từ quan hệ (who, whom, whose, which, that) và công thức rút gọn mệnh đề quan hệ thành V-ing hoặc V3/ed.",formulas:{aff:"Người + WHO + V  |  Vật + WHICH + V  |  Người/Vật + WHOSE + Danh từ (sở hữu)",neg:"Rút gọn Chủ động: ... N + (who/which + V) -> ... N + V-ING (khi có tân ngữ phía sau)",ques:"Rút gọn Bị động: ... N + (who/which + be + V3/ed) -> ... N + V3/ED (khi sau đó là giới từ)"},usages:["WHO: Thay cho danh từ chỉ người, theo sau là Động từ.","WHOSE: Thay cho tính từ sở hữu, theo sau BẮT BUỘC là một Danh từ không có mạo từ (whose application, whose car).","RÚT GỌN MỆNH ĐỀ: Khi trong câu ĐÃ CÓ động từ chính được chia thì rồi, thì động từ thứ 2 bổ nghĩa cho danh từ đứng trước phải rút gọn thành V-ing (chủ động) hoặc V3/ed (bị động)!"],signals:["Danh từ + _______ + Danh từ + V -> Điền WHOSE!","Câu đã có Động từ chính, chỗ trống đứng ngay sau Danh từ -> Chọn V-ing (chủ động) hoặc V3/ed (bị động)."],toeicTips:["🔥 BÍ KÍP RÚT GỌN MỆNH ĐỀ (Rất hay gặp trong Part 5): Nếu câu đã có 1 động từ chính (VD: is, was, will be, has...), mà đề bắt điền thêm 1 dạng động từ ngay sau danh từ (và không có who/which/that): Hãy chọn V-ing nếu mang nghĩa chủ động (có tân ngữ sau chỗ trống) hoặc V3/ed nếu mang nghĩa bị động (sau chỗ trống là giới từ)!"],examples:[{en:"Applicants whose resumes meet our requirements will be contacted.",vi:"Những ứng viên mà hồ sơ của họ đáp ứng yêu cầu của chúng tôi sẽ được liên hệ.",note:'Trước chỗ trống là "Applicants", sau chỗ trống là danh từ "resumes" -> chọn whose.'},{en:"Items purchased during the clearance sale cannot be returned.",vi:"Các mặt hàng được mua trong đợt giảm giá xả kho không thể đổi trả.",note:'Câu đã có động từ chính "cannot be returned" -> rút gọn mệnh đề bị động (which were purchased -> purchased).'}]}],Ja=[{id:"gq1",topicId:"present_simple",topicName:"1. Thì Hiện Tại Đơn",question:"The shuttle bus to the international terminal _______ every twenty minutes.",options:["departs","departing","will have departed","was departed"],correctIndex:0,signalWord:"every twenty minutes",explanation:'Dấu hiệu "every twenty minutes" chỉ lịch trình lặp lại định kỳ -> Dùng thì Hiện tại đơn. Chủ ngữ "The shuttle bus" là số ít nên chọn "departs".',translation:"Xe buýt trung chuyển tới nhà ga quốc tế khởi hành mỗi 20 phút một chuyến."},{id:"gq2",topicId:"present_simple",topicName:"1. Thì Hiện Tại Đơn",question:"Once the accounting department _______ your travel receipts, the reimbursement will be issued.",options:["will verify","verifies","verified","verifying"],correctIndex:1,signalWord:"Once ... , ... will be",explanation:'Trong mệnh đề thời gian bắt đầu bằng "Once" (Một khi), không dùng thì tương lai (will) mà phải dùng thì Hiện tại đơn. Chủ ngữ "the accounting department" là số ít -> chọn "verifies".',translation:"Một khi phòng kế toán xác minh biên lai công tác của bạn, khoản tiền hoàn trả sẽ được chuyển."},{id:"gq3",topicId:"present_continuous",topicName:"2. Thì Hiện Tại Tiếp Diễn",question:"Our software engineers are currently _______ a security patch for the mobile app.",options:["develop","developed","developing","development"],correctIndex:2,signalWord:"are currently + Tân ngữ",explanation:'Có trạng từ "currently" (hiện tại) đứng sau "are" và phía sau có tân ngữ "a security patch" (chủ động) -> Thì Hiện tại tiếp diễn: are + V-ing (developing).',translation:"Các kỹ sư phần mềm của chúng tôi hiện đang phát triển một bản vá bảo mật cho ứng dụng di động."},{id:"gq4",topicId:"present_continuous",topicName:"2. Thì Hiện Tại Tiếp Diễn",question:"Please use the side entrance because the main lobby _______ right now.",options:["is repainting","is being repainted","has repainted","repaints"],correctIndex:1,signalWord:"right now + Chủ ngữ là vật (the main lobby)",explanation:'Có "right now" (Hiện tại tiếp diễn) và chủ ngữ là "the main lobby" (Sảnh chính -> bị sơn lại, không tự sơn được) -> Bị động hiện tại tiếp diễn: is being + V3/ed (is being repainted).',translation:"Vui lòng đi lối cửa phụ vì sảnh chính hiện đang được sơn lại."},{id:"gq5",topicId:"present_perfect",topicName:"3. Thì Hiện Tại Hoàn Thành",question:"Apex Corporation _______ three new retail branches over the past two years.",options:["opens","opened","has opened","will open"],correctIndex:2,signalWord:"over the past two years",explanation:'Cụm "over the past + khoảng thời gian" (trong suốt 2 năm qua) là dấu hiệu kinh điển của thì Hiện tại hoàn thành (have/has + V3/ed) -> chọn "has opened".',translation:"Tập đoàn Apex đã mở thêm ba chi nhánh bán lẻ mới trong suốt hai năm qua."},{id:"gq6",topicId:"present_perfect",topicName:"3. Thì Hiện Tại Hoàn Thành",question:"Since Mr. Rossi _______ promoted to Marketing Director, online sales have doubled.",options:["has been","was","is","will be"],correctIndex:1,signalWord:"Since + Mệnh đề, ... have doubled",explanation:'Công thức vàng TOEIC: [Since + S + V2/ed (Quá khứ đơn)], [S + have/has + V3/ed (Hiện tại hoàn thành)]. Ngay trong mệnh đề chứa "Since", ta dùng Quá khứ đơn -> chọn "was".',translation:"Kể từ khi ông Rossi được thăng chức làm Giám đốc Tiếp thị, doanh số trực tuyến đã tăng gấp đôi."},{id:"gq7",topicId:"past_simple",topicName:"5. Thì Quá Khứ Đơn",question:"The board of directors _______ the merger proposal at yesterday’s meeting.",options:["approves","has approved","approved","approving"],correctIndex:2,signalWord:"yesterday’s meeting",explanation:'Có mốc thời gian đã kết thúc trong quá khứ "yesterday’s meeting" -> Chọn thì Quá khứ đơn (approved).',translation:"Hội đồng quản trị đã phê duyệt bản đề xuất sáp nhập tại cuộc họp ngày hôm qua."},{id:"gq8",topicId:"past_simple",topicName:"5. Thì Quá Khứ Đơn",question:"Ms. Lin _______ worked as a financial analyst in London before relocating to Seoul.",options:["formerly","currently","shortly","yet"],correctIndex:0,signalWord:"worked (V2/ed) ... before relocating",explanation:'Động từ "worked" chia ở Quá khứ đơn, diễn tả công việc trước đây -> Chọn trạng từ "formerly" (trước đây). (currently dùng cho hiện tại, shortly dùng cho tương lai).',translation:"Cô Lin trước đây từng làm chuyên viên phân tích tài chính tại London trước khi chuyển đến Seoul."},{id:"gq9",topicId:"past_perfect",topicName:"7. Thì Quá Khứ Hoàn Thành",question:"By the time the keynote speaker arrived at the hall, most attendees _______ their seats.",options:["take","have taken","had taken","will have taken"],correctIndex:2,signalWord:"By the time + arrived (V2/ed)",explanation:'Công thức 3 giây: "By the time + S + V2/ed (arrived)", mệnh đề chính chia ở Quá khứ hoàn thành (had + V3/ed) -> chọn "had taken".',translation:"Vào lúc diễn giả chính đến hội trường, hầu hết người tham dự đã ngồi vào chỗ của mình rồi."},{id:"gq10",topicId:"future_simple",topicName:"9. Thì Tương Lai Đơn & Tương Lai Gần",question:"A technician _______ your office shortly to inspect the malfunctioning copier.",options:["visited","has visited","will visit","visiting"],correctIndex:2,signalWord:"shortly (= soon)",explanation:'Trạng từ "shortly" trong TOEIC có nghĩa là "ngay sau đây / sớm thôi" (= soon) -> Dấu hiệu của thì Tương lai đơn: chọn "will visit".',translation:"Một kỹ thuật viên sẽ ghé văn phòng của bạn ngay sau đây để kiểm tra chiếc máy photocopy bị lỗi."},{id:"gq11",topicId:"future_perfect",topicName:"11. Thì Tương Lai Hoàn Thành",question:"By the time the new fiscal year begins in April, we _______ the warehouse expansion.",options:["completed","had completed","will have completed","are completing"],correctIndex:2,signalWord:"By the time + begins (Hiện tại đơn)",explanation:'Công thức: "By the time + S + V(s/es) [begins]", mệnh đề chính diễn tả việc sẽ hoàn tất trước mốc tương lai đó -> dùng Tương lai hoàn thành (will have + V3/ed).',translation:"Vào lúc năm tài chính mới bắt đầu vào tháng Tư, chúng tôi sẽ hoàn thành xong việc mở rộng nhà kho."},{id:"gq12",topicId:"core_word_form",topicName:"Chuyên đề 1: Từ Loại (Danh - Động - Tính - Trạng)",question:"All factory workers must wear _______ gear when entering the assembly area.",options:["protect","protection","protective","protectively"],correctIndex:2,signalWord:"_______ + gear (Danh từ)",explanation:'Đứng ngay trước danh từ "gear" (trang thiết bị) cần một Tính từ để bổ nghĩa (trang thiết bị bảo hộ) -> Chọn tính từ đuôi -ive: "protective".',translation:"Tất cả công nhân nhà máy phải mặc đồ bảo hộ khi bước vào khu vực lắp ráp."},{id:"gq13",topicId:"core_word_form",topicName:"Chuyên đề 1: Từ Loại (Danh - Động - Tính - Trạng)",question:"The new accounting software allows us to process invoices much more _______.",options:["efficient","efficiently","efficiency","efficiencies"],correctIndex:1,signalWord:"process invoices (V + O) + more _______",explanation:'Cần một từ bổ nghĩa cho động từ thường "process" (xử lý hóa đơn một cách hiệu quả hơn) -> Chọn Trạng từ đuôi -ly: "efficiently".',translation:"Phần mềm kế toán mới cho phép chúng tôi xử lý hóa đơn một cách hiệu quả hơn nhiều."},{id:"gq14",topicId:"core_word_form",topicName:"Chuyên đề 1: Từ Loại (Danh - Động - Tính - Trạng)",question:"Please submit your _______ for the conference room at least two days in advance.",options:["reserve","reserved","reservation","reserving"],correctIndex:2,signalWord:"your (Tính từ sở hữu) + _______ + for",explanation:'Sau tính từ sở hữu "your" và trước giới từ "for" bắt buộc phải là một Danh từ -> Chọn "reservation" (sự đặt chỗ).',translation:"Vui lòng gửi yêu cầu đặt phòng hội nghị của bạn trước ít nhất hai ngày."},{id:"gq15",topicId:"core_passive",topicName:"Chuyên đề 2: Câu Bị Động (Passive Voice)",question:"Complimentary refreshments _______ in the main lobby during the intermission.",options:["will serve","will be served","have served","serving"],correctIndex:1,signalWord:'Chủ ngữ là vật (refreshments) + sau chỗ trống là giới từ "in"',explanation:'Chủ ngữ "refreshments" (đồ ăn thức uống nhẹ) là vật, phía sau chỗ trống không có tân ngữ mà là giới từ "in" -> Chia BỊ ĐỘNG: "will be served" (sẽ được phục vụ).',translation:"Đồ ăn thức uống nhẹ miễn phí sẽ được phục vụ tại sảnh chính trong giờ giải lao."},{id:"gq16",topicId:"core_passive",topicName:"Chuyên đề 2: Câu Bị Động (Passive Voice)",question:"Your annual membership card _______ at the end of this month unless renewed.",options:["will be expired","will expire","is expiring by","has been expired"],correctIndex:1,signalWord:'Ngoại lệ nội động từ "expire" (hết hạn)',explanation:'Bẫy kinh điển TOEIC: Động từ "expire" (hết hạn), cùng với "occur, happen, take place, remain", là NỘI ĐỘNG TỪ nên KHÔNG BAO GIỜ chia bị động -> Chọn chủ động "will expire".',translation:"Thẻ thành viên hàng năm của bạn sẽ hết hạn vào cuối tháng này trừ khi được gia hạn."},{id:"gq17",topicId:"core_conditionals",topicName:"Chuyên đề 3: Câu Điều Kiện & Đảo Ngữ (Should / Were / Had)",question:"_______ you experience any technical difficulties, please contact our IT help desk.",options:["Should","Were","Had","Unless"],correctIndex:0,signalWord:"_______ + you + experience (V_nguyên mẫu), please + V",explanation:'Đảo ngữ câu điều kiện loại 1 (thay cho If): Đầu câu đứng trước "S + V_nguyên mẫu" và vế sau có "please + V" -> Chọn ngay "Should"!',translation:"Nếu bạn gặp phải bất kỳ trục trặc kỹ thuật nào, vui lòng liên hệ bộ phận hỗ trợ CNTT của chúng tôi."},{id:"gq18",topicId:"core_conditionals",topicName:"Chuyên đề 3: Câu Điều Kiện & Đảo Ngữ (Should / Were / Had)",question:"If the supplier had delivered the parts on time, we _______ the production schedule.",options:["will meet","would meet","would have met","met"],correctIndex:2,signalWord:"If + had delivered (had V3/ed)",explanation:'Mệnh đề If chia ở "had + V3/ed" (Câu điều kiện loại 3 - trái với quá khứ) -> Mệnh đề chính phải dùng "would have + V3/ed" (would have met).',translation:"Giá như nhà cung cấp giao linh kiện đúng hạn thì chúng tôi đã kịp tiến độ sản xuất rồi."},{id:"gq19",topicId:"core_sv_agreement",topicName:"Chuyên đề 4: Sự Hòa Hợp Chủ Ngữ & Động Từ",question:"The number of employees working remotely _______ increased significantly since 2022.",options:["have","has","are","were"],correctIndex:1,signalWord:"The number of + N_nhiều + V_SỐ ÍT",explanation:'Cấu trúc "The number of + danh từ số nhiều" (Con số những...) luôn đi với động từ SỐ ÍT! Phía sau có "increased (V3) ... since 2022" -> Chọn "has".',translation:"Số lượng nhân viên làm việc từ xa đã tăng lên đáng kể từ năm 2022."},{id:"gq20",topicId:"core_relative",topicName:"Chuyên đề 5: Mệnh Đề Quan Hệ & Rút Gọn (V-ing / V3-ed)",question:"Passengers _______ to board Flight 302 should proceed to Gate 14 immediately.",options:["wait","waited","waiting","are waiting"],correctIndex:2,signalWord:'Câu đã có động từ chính "should proceed" -> Rút gọn mệnh đề',explanation:'Câu đã có động từ chính là "should proceed". Chỗ trống đứng sau danh từ "Passengers" để rút gọn mệnh đề quan hệ chủ động (who are waiting -> waiting).',translation:"Những hành khách đang chờ lên chuyến bay 302 xin vui lòng di chuyển tới Cổng 14 ngay lập tức."}],bp=({pref:e,onEarnXp:n})=>{const[t,i]=w.useState("tenses"),[a,s]=w.useState("ALL"),[o,l]=w.useState("present_simple"),[h,g]=w.useState("formula"),[y,x]=w.useState(()=>{try{const u=localStorage.getItem("toeic_pro_grammar_mastered");return u?JSON.parse(u):{}}catch{r
